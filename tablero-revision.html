<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Máquina Tonisaxmusic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEF;
  --surface:#FFFFFF;
  --surface-2:#F4F6F8;
  --surface-3:#EBEEF2;
  --ink:#17202C;
  --muted:#5B6574;
  --faint:#8A93A1;
  --line:#D6DBE2;
  --line-strong:#BEC5CF;
  --brass:#C9901F;
  --brass-ink:#7E5608;
  --brass-soft:#F7EBCF;
  --danger:#C2412D;
  --danger-soft:#FBE6E1;
  --ok:#2F8A47;
  --ok-soft:#E1F2E5;
  --shadow:0 1px 2px rgba(23,32,44,.06),0 4px 14px rgba(23,32,44,.06);
  --shadow-lift:0 6px 24px rgba(23,32,44,.16);
  --s-seleccion:#71809A;
  --s-instrucciones:#8A63D2;
  --s-listo:#2F74D0;
  --s-edicion:#D9961C;
  --s-revision:#E0603A;
  --s-publicar:#13968A;
  --s-publicado:#2F8A47;
  --s-archivado:#959DA9;
  --radius:12px;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Figtree',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10141A; --surface:#181E27; --surface-2:#1F2631; --surface-3:#262E3A;
    --ink:#E7EBF0; --muted:#9BA5B3; --faint:#717C8B; --line:#2A3340; --line-strong:#3A4553;
    --brass:#E2A93A; --brass-ink:#F0C46A; --brass-soft:#3A2E16;
    --danger:#F07A63; --danger-soft:#3D2019; --ok:#5EC27A; --ok-soft:#173222;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --shadow-lift:0 8px 28px rgba(0,0,0,.5);
    --s-seleccion:#8E9BB3; --s-instrucciones:#A889E6; --s-listo:#5C9BEB;
    --s-edicion:#E9AE3F; --s-revision:#F2825F; --s-publicar:#3BBDAF; --s-publicado:#5EC27A; --s-archivado:#7E8794;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brass-ink)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra superior ---------- */
.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px clamp(16px,3vw,32px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand h1{
  font-family:var(--display);font-weight:750;font-size:22px;line-height:1.1;margin:0;
  letter-spacing:-.01em;
}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy::before{background:var(--brass);animation:pulso 1s infinite alternate}
.sync.err{color:var(--danger)}
.sync.err::before{background:var(--danger)}
@keyframes pulso{to{opacity:.3}}
.search{
  width:220px;max-width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;font-size:14px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);
  padding:8px 14px;font-weight:600;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink);
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 85%,var(--brass))}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#1A1205}
.btn.brass:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn input[type=file]{display:none}
.menu{position:relative}
.menu-list{
  position:absolute;right:0;top:calc(100% + 6px);min-width:230px;z-index:40;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lift);
  padding:6px;display:flex;flex-direction:column;
}
.menu-list button,.menu-list label{
  text-align:left;background:none;border:0;border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer;
}
.menu-list button:hover,.menu-list label:hover{background:var(--surface-2)}
.menu-list label input{display:none}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.badge-lectura{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px}
.aviso{
  margin:12px clamp(16px,3vw,32px) 0;padding:10px 14px;border-radius:10px;
  background:var(--brass-soft);color:var(--ink);font-size:14px;display:flex;gap:12px;align-items:flex-start
}
.aviso.err{background:var(--danger-soft)}
.aviso button{margin-left:auto;background:none;border:0;font-size:18px;line-height:1;color:var(--muted)}

/* ---------- tablero de columnas ---------- */
.board{
  display:flex;gap:14px;align-items:flex-start;
  padding:18px clamp(16px,3vw,32px) 40px;
  overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:clamp(16px,3vw,32px);
  min-height:calc(100vh - 80px);
}
.board::after{content:"";flex:0 0 1px}
.col{
  flex:0 0 256px;scroll-snap-align:start;
  display:flex;flex-direction:column;
  max-height:calc(100vh - 120px);
  border-radius:var(--radius);
  background:var(--surface-3);
  position:relative;
}
.col::before{
  /* el riel: cada columna aporta su tramo de color */
  content:"";position:absolute;left:0;right:-14px;top:0;height:5px;
  background:var(--c);border-radius:var(--radius) 0 0 0;
}
.col[data-col=publicado]::before,.col.arch::before{right:0;border-radius:var(--radius) var(--radius) 0 0}
.col.arch{margin-left:10px}
.col-head{padding:16px 14px 10px;display:flex;flex-direction:column;gap:2px}
.col-title{display:flex;align-items:baseline;gap:8px}
.col-title h2{font-family:var(--display);font-weight:650;font-size:16px;margin:0;line-height:1.25}
.col-n{
  margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;
  color:var(--c);
}
.col-desc{margin:0;color:var(--muted);font-size:12.5px;line-height:1.35}
.col-body{padding:4px 10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:60px}
.col.drop .col-body{background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:0 0 var(--radius) var(--radius)}
.col-empty{color:var(--faint);font-size:13px;padding:10px 6px;text-align:center}
.col-more{align-self:center}

.card{
  flex-shrink:0;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;
  display:flex;flex-direction:column;overflow:hidden;width:100%;
}
.card:hover{border-color:var(--line-strong)}
.card.dragging{opacity:.45}
.thumb{
  position:relative;aspect-ratio:2/1;background:
    linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface-2)),var(--surface-2));
  display:flex;align-items:flex-end;padding:8px 10px;overflow:hidden;
}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .thumb-txt{position:relative;font-size:12px;font-weight:600;color:var(--muted)}
.thumb .ver{
  position:absolute;top:8px;right:8px;font-size:11.5px;font-weight:700;
  background:rgba(14,18,24,.72);color:#fff;border-radius:6px;padding:2px 7px;
}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.card-title{font-weight:650;font-size:14.5px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:6px;
  background:var(--surface-2);color:var(--muted);white-space:nowrap
}
.chip.warn{background:var(--brass-soft);color:var(--brass-ink)}
.chip.late{background:var(--danger-soft);color:var(--danger)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.turno{background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink)}
.arch-toggle{flex:0 0 auto;align-self:flex-start;margin-top:2px}

/* ---------- detalle ---------- */
.sheet-wrap{
  position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;
  background:rgba(12,16,22,.42);
}
.sheet{
  width:min(1180px,100%);height:100%;background:var(--bg);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lift);
}
.sheet.entra{animation:entra .22s ease-out}
@keyframes entra{from{transform:translateX(28px);opacity:.4}}
@media (prefers-reduced-motion: reduce){.sheet.entra{animation:none}.sync.busy::before{animation:none}}
.sheet-head{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px clamp(16px,3vw,28px) 0;
}
.sh-row{display:flex;align-items:center;gap:10px}
.sh-title{
  flex:1;min-width:0;font-family:var(--display);font-weight:650;font-size:22px;line-height:1.2;
  border:1px solid transparent;border-radius:8px;background:transparent;padding:4px 8px;margin-left:-8px;
}
.sh-title:hover{border-color:var(--line)}
.sh-title:focus{border-color:var(--line-strong);background:var(--surface-2);outline:none}
.sh-sub{color:var(--muted);font-size:13px;margin:2px 0 0}

/* riel de estados */
.rail{position:relative;display:flex;margin:16px 0 0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail li{flex:1 0 auto;min-width:92px;position:relative}
.rail button{
  width:100%;background:none;border:0;padding:0 4px 12px;text-align:left;
  display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--faint);font-weight:600;
}
.rail .bar{height:6px;border-radius:3px;background:var(--surface-3);display:block}
.rail li.done .bar,.rail li.now .bar{background:var(--c)}
.rail li.done button{color:var(--muted)}
.rail li.now button{color:var(--ink)}
.rail li.now .bar{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
.rail li + li button{padding-left:6px}
.rail button:hover .lab{color:var(--ink)}
.rail.archivado li .bar{background:var(--surface-3)!important;box-shadow:none!important}

.next{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:0 calc(-1*clamp(16px,3vw,28px));padding:12px clamp(16px,3vw,28px);
  background:color-mix(in srgb,var(--c) 10%,var(--surface));
  border-top:1px solid color-mix(in srgb,var(--c) 30%,var(--line));
}
.next p{margin:0 auto 0 0;font-size:14.5px;flex:1 1 260px}
.next b{font-weight:700}

.tabs{display:flex;gap:4px;margin-top:0;border-bottom:1px solid var(--line);background:var(--surface);padding:0 clamp(16px,3vw,28px);overflow-x:auto;scrollbar-width:none}
.tabs button{
  background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px 9px;
  font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap
}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{font-size:12px;color:var(--faint);margin-left:4px}

.sheet-body{flex:1;overflow-y:auto;padding:20px clamp(16px,3vw,28px) 60px}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:start}
.grid.solo{grid-template-columns:minmax(0,760px)}
.vid-col{position:sticky;top:0;display:flex;flex-direction:column;gap:10px}
.frame{background:#000;border-radius:var(--radius);overflow:hidden;position:relative}
.frame iframe{display:block;width:100%;height:100%;border:0}
.frame.h{aspect-ratio:16/9}
.frame.v{aspect-ratio:9/16;max-height:72vh;margin:0 auto;width:auto;height:72vh;max-width:100%}
.frame-empty{
  border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:22px 18px;
  color:var(--muted);font-size:14px;background:var(--surface)
}
.vid-links{display:flex;gap:6px;flex-wrap:wrap}
.links{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 4px;margin-bottom:16px}
.links .row2{gap:10px}
.links h4{font-family:var(--display);font-weight:650;font-size:15px;margin:0 0 10px}
.links .field > span{display:flex;justify-content:space-between;gap:8px}
.links .field a{font-weight:600;font-size:12.5px}

/* meses */
.meses{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:14px clamp(16px,3vw,32px) 0}
.meses::-webkit-scrollbar{display:none}
.mes{
  flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 13px;font-weight:600;font-size:13.5px;color:var(--muted);display:flex;gap:7px;align-items:baseline
}
.mes:hover{border-color:var(--line-strong);color:var(--ink)}
.mes[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.mes .n{font-variant-numeric:tabular-nums;font-size:12px;opacity:.75}
.mes-ctl{display:inline-flex;align-items:center;gap:6px;margin-left:6px}
.mes-ctl input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 6px;font-size:13px;color:var(--ink)}

/* links de todos los videos */
.modal.ancho{width:min(860px,100%)}
.lk-grupo{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.lk-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lk-row .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.lk-row .nm small{display:block;font-weight:500;color:var(--faint);font-size:12px}
.lk-row .inp{font-size:13px;padding:7px 10px}
.lk-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
@media (max-width: 640px){ .lk-row,.lk-head{grid-template-columns:1fr} .lk-head{display:none} }

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 20px;margin-bottom:16px}
.panel h3{font-family:var(--display);font-weight:650;font-size:17px;margin:0 0 4px}
.panel .hint{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.inp,textarea.inp{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;font-size:14.5px;line-height:1.45;
}
textarea.inp{resize:vertical;min-height:44px;field-sizing:content;max-height:420px}
.inp:focus{outline:none;border-color:var(--brass);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
.inp:read-only{background:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fechas{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.fechas.destaca{border-color:var(--s-listo);background:color-mix(in srgb,var(--s-listo) 7%,var(--surface))}
dl.datos{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 14px;font-size:14px}
dl.datos dt{color:var(--muted)}
dl.datos dd{margin:0;overflow-wrap:anywhere}
.decide{display:flex;gap:10px;margin:4px 0 16px}
.decide .btn{flex:1;padding:12px}
.decide .on.si{background:var(--ok);border-color:var(--ok);color:#fff}
.decide .on.no{background:var(--danger);border-color:var(--danger);color:#fff}

/* adjuntos y audios */
.adj{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.adj-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.adj-head{display:flex;align-items:center;gap:8px;font-size:13.5px}
.adj-head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.adj-head a,.adj-head button{font-size:13px;background:none;border:0;padding:0;color:var(--brass-ink);font-weight:600}
.adj-item iframe{display:block;width:100%;height:96px;border:0;margin-top:6px;border-radius:6px}
.adj-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.rec{background:var(--danger)!important;border-color:var(--danger)!important;color:#fff!important}
.st{font-size:13px;color:var(--muted)}
.st.err{color:var(--danger)}

/* versiones */
.vers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.vers button{
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;
  font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px
}
.vers button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.ver-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ver-head h3{margin:0}
.pill{
  font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)
}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.flag{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill.wait{background:var(--brass-soft);color:var(--brass-ink);border-color:transparent}
button.pill{cursor:pointer}
.historico{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.line{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .num{font-variant-numeric:tabular-nums;color:var(--faint);font-weight:700;font-size:13px;padding-top:2px}
.line .txt{font-size:15px;margin-bottom:8px}
.line .ctl{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.line .ctl .inp{flex:1 1 220px;min-height:38px}
.tc{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.tc:first-of-type{border-top:0}
.tc-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.tc-time{font-weight:700;font-variant-numeric:tabular-nums}
.tc-type{color:var(--muted)}
.tc-head .pill{margin-left:auto}
.tc-new{display:grid;grid-template-columns:110px 140px 1fr auto;gap:8px;margin-top:10px}
.sec-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}

.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.loading{padding:60px;text-align:center;color:var(--muted)}

/* modal */
.modal-wrap{position:fixed;inset:0;z-index:70;background:rgba(12,16,22,.5);display:flex;align-items:center;justify-content:center;padding:16px}

<body>

<header class="top">
  <div class="brand">
    <h1>Máquina Tonisaxmusic</h1>
    <p>Flujo de los videos de Toni, de la selección a la publicación</p>
  </div>
  <span class="badge-lectura" id="badge-lectura" hidden>Solo lectura</span>
  <span class="sync" id="sync" role="status">Cargando</span>

      <button data-act="exportar">Descargar correcciones de Toni</button>

</header>

<div id="avisos"></div>
<nav class="meses" id="meses" aria-label="Mes"></nav>
<main class="board" id="board"><div class="loading">Cargando el tablero…</div></main>
<div id="sheet-root"></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   Configuración
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwSnwOwdpQTZAmKCLmpynEnSCvzuhzC_jv7Afl3NTQvtP4jecCG3wNZyhUArDPsrpRUpg/exec';
const LECTURA = new URLSearchParams(location.search).has('lectura');
const ADJ_MAX = 25 * 1024 * 1024;

const ESTADOS = [
  { k:'seleccion',     n:'Selección',                 d:'Videos pendientes de decidir si se editan o se descartan.' },
  { k:'instrucciones', n:'Pendiente de instrucciones', d:'Seleccionados a los que aún falta añadir instrucciones y material.' },
  { k:'listo',         n:'Listo para editar',         d:'Ya tienen toda la información y el material para empezar.' },
  { k:'edicion',       n:'En edición',                d:'El editor está trabajando en el video.' },
  { k:'revision',      n:'En revisión',               d:'Versiones enviadas para revisar y gestionar cambios.' },
  { k:'publicar',      n:'Pendiente de publicar',     d:'Video aprobado y listo para subir.' },
  { k:'publicado',     n:'Publicado',                 d:'Videos ya publicados, con su fecha y enlace.' },
  { k:'archivado',     n:'Archivado',                 d:'Descartados o que no se van a continuar.' }
];
const EST = Object.fromEntries(ESTADOS.map((e, i) => [e.k, Object.assign({ i }, e)]));
const PLATAFORMAS = ['Instagram', 'TikTok', 'YouTube Shorts', 'YouTube', 'Facebook'];
const CAMPOS_INSTR = [
  ['guion', 'Guion', 'El texto que va en pantalla o la idea del guion'],
  ['instrucciones', 'Instrucciones de edición', 'Cortes, ritmo, qué mostrar y en qué orden'],
  ['grabaciones', 'Grabaciones necesarias', 'Tomas extra, voz en off, audios que hay que grabar'],
  ['recursos', 'Imágenes y recursos', 'Fotos, logos, textos, gráficos'],
  ['referencias', 'Referencias', 'Links a videos que sirvan de ejemplo'],
  ['musica', 'Música, efectos o indicaciones visuales', 'Canción, efectos de sonido, transiciones, colores'],
  ['observaciones', 'Observaciones adicionales', 'Cualquier otra cosa que el editor deba saber']
];

document.documentElement.classList.toggle('lectura', LECTURA);

/* =========================================================
   Estado
   ========================================================= */
let items = [];
let cargado = false;
let verArchivados = false;
let filtro = '';
let mesActivo = (() => { try{ return localStorage.getItem('tablero-mes') || mesActual(); }catch(e){ return mesActual(); } })();
function mesActual(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
let abierto = null;        // id del video abierto
let tab = null;            // pestaña del detalle
let verSel = {};           // versión elegida por video
let publicadosTodos = false;
let rec = null;            // grabación en curso
let animarHoja = false;

/* =========================================================
   Utilidades
   ========================================================= */
const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function driveId(url){ const m = String(url || '').match(/[-\w]{25,}/); return m ? m[0] : null; }
function driveEmbed(url){ const id = driveId(url); return id ? 'https://drive.google.com/file/d/' + id + '/preview' : null; }
function driveVer(url){ const id = driveId(url); return id ? 'https://drive.google.com/file/d/' + id + '/view' : null; }
function driveDescarga(url){ const id = driveId(url); return id ? 'https://drive.google.com/uc?export=download&id=' + id : null; }
function driveThumb(url){ const id = driveId(url); return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w480' : null; }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function hoyISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fechaLocal(iso){
  if(!iso) return null;
  const s = String(iso);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const [a,m,d] = s.split('-').map(Number); return new Date(a, m-1, d); }
  const d = new Date(s); return isNaN(d) ? null : d;
}
function fCorta(iso){
  const d = fechaLocal(iso); if(!d) return '';
  return d.toLocaleDateString('es-MX', { day:'numeric', month:'short' }).replace('.', '');
}
function fLarga(iso){
  const d = fechaLocal(iso); if(!d) return '';
  const t = d.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function diasHasta(iso){
  const d = fechaLocal(iso); if(!d) return null;
  const h = fechaLocal(hoyISO());
  return Math.round((d - h) / 86400000);
}
function tamLegible(b){ return b > 1048576 ? (b/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b/1024)) + ' KB'; }
function get(obj, path){
  return String(path).split('.').reduce((o, seg) => {
    if(o == null) return undefined;
    if(Array.isArray(o) && seg.charAt(0) === '@') return o.find(x => x && String(x.id) === seg.slice(1));
    return o[seg];
  }, obj);
}
function itemPor(id){ return items.find(x => x.id === id); }
function ultimaVersion(it){ const v = it.versiones || []; return v[v.length - 1] || null; }
function versionAprobada(it){ return (it.versiones || []).slice().reverse().find(v => v.estado === 'aprobada') || null; }
function normalizar(it){
  it.origen = it.origen || {}; it.seleccion = it.seleccion || {}; it.instrucciones = it.instrucciones || {};
  it.adjuntos = Array.isArray(it.adjuntos) ? it.adjuntos : []; it.fechas = it.fechas || {};
  it.versiones = Array.isArray(it.versiones) ? it.versiones : []; it.publicacion = it.publicacion || {};
  it.publicado = it.publicado || {}; it.archivado = it.archivado || {}; it.historial = it.historial || [];
  it.versiones.forEach(v => {
    v.scriptLines = Array.isArray(v.scriptLines) ? v.scriptLines : [];
    v.timestampComments = Array.isArray(v.timestampComments) ? v.timestampComments : [];
    v.audioNotes = Array.isArray(v.audioNotes) ? v.audioNotes : [];
  });
  if(!EST[it.estado]) it.estado = 'seleccion';
  return it;
}

/* misma lógica que el Apps Script, para aplicar los cambios aquí al instante */
function segmentoEn(cont, seg){
  if(Array.isArray(cont)){
    if(seg.charAt(0) === '@'){ const id = seg.slice(1); return cont.findIndex(x => x && String(x.id) === id); }
    return Number(seg);
  }
  return seg;
}
function aplicarOps(obj, ops){
  (ops || []).forEach(op => {
    if(!op || !op.path) return;
    const partes = String(op.path).split('.');
    let cont = obj;
    for(let i = 0; i < partes.length - 1; i++){
      const k = segmentoEn(cont, partes[i]);
      if(k === -1 || k === undefined) return;
      if(cont[k] == null || typeof cont[k] !== 'object'){
        const sig = partes[i+1];
        cont[k] = (sig.charAt(0) === '@' || /^\d+$/.test(sig)) ? [] : {};
      }
      cont = cont[k];
    }
    const ult = segmentoEn(cont, partes[partes.length - 1]);
    if(ult === -1) return;
    if(op.op === 'set') cont[ult] = op.value;
    else if(op.op === 'push'){
      if(!Array.isArray(cont[ult])) cont[ult] = [];
      if(!(op.value && op.value.id && cont[ult].some(x => x && x.id === op.value.id))) cont[ult].push(op.value);
    } else if(op.op === 'pull'){
      if(Array.isArray(cont[ult])) cont[ult] = cont[ult].filter(x => !x || String(x.id) !== String(op.id));
    }
  });
  return obj;
}

/* =========================================================
   Comunicación con la hoja (Apps Script)
   ========================================================= */
async function api(body){
  const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'La hoja no respondió bien');
  return data;
}

const cola = new Map();     // id -> Map(clave -> op)
const timers = {};
let enviando = 0, fallas = 0;

function setSync(){
  const s = $('#sync');
  const pend = [...cola.values()].reduce((n, m) => n + m.size, 0);
  s.classList.toggle('busy', enviando > 0 || pend > 0);
  s.classList.toggle('err', fallas > 0);
  s.textContent = fallas > 0 ? 'Sin conexión, reintentando' : (enviando > 0 || pend > 0 ? 'Guardando' : (cargado ? 'Guardado' : 'Cargando'));
}

/* Cambia el video aquí y lo manda a la hoja. Los textos se agrupan y se mandan al dejar de escribir. */
function cambiar(id, ops, espera){
  if(LECTURA) return;
  const it = itemPor(id); if(!it) return;
  aplicarOps(it, ops);
  if(!cola.has(id)) cola.set(id, new Map());
  const m = cola.get(id);
  ops.forEach(op => {
    const clave = op.op === 'set' ? 'set:' + op.path : uid(op.op + ':');
    m.delete(clave); m.set(clave, op);
  });
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => enviar(id), espera == null ? 0 : espera);
  setSync();
}

async function enviar(id){
  clearTimeout(timers[id]);
  const m = cola.get(id);
  if(!m || !m.size) return;
  cola.delete(id);
  const ops = [...m.values()];
  enviando++; setSync();
  try{
    const r = await api({ action:'patchItem', id, ops });
    fallas = 0;
    const it = itemPor(id);
    if(it && r.item) it.actualizado = r.item.actualizado;
  }catch(e){
    console.error(e);
    fallas++;
    const nueva = new Map(ops.map(op => [op.op === 'set' ? 'set:' + op.path : uid(op.op + ':'), op]));
    const resto = cola.get(id);
    if(resto) resto.forEach((v, k) => { nueva.delete(k); nueva.set(k, v); });
    cola.set(id, nueva);
    timers[id] = setTimeout(() => enviar(id), 4000);
  }finally{
    enviando--; setSync();
  }
}
function enviarTodo(){ [...cola.keys()].forEach(id => enviar(id)); }
window.addEventListener('pagehide', () => {
  cola.forEach((m, id) => {
    if(!m.size) return;
    try{ fetch(API_URL, { method:'POST', mode:'no-cors', keepalive:true, headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action:'patchItem', id, ops:[...m.values()] }) }); }catch(e){}
  });
});

async function cargar(silencioso){
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    if(!data || !Array.isArray(data.items)){
      avisar('La hoja todavía tiene el Apps Script anterior. Pega el código nuevo en Extensiones → Apps Script e implementa una nueva versión.', true, 'script');
      cargado = true; items = []; setSync(); renderBoard(); return;
    }
    const nuevos = data.items.map(normalizar);
    if(silencioso){
      // no pisar lo que se está escribiendo ni lo que falta por guardar
      const foco = document.activeElement && document.activeElement.closest && document.activeElement.closest('.sheet');
      items = nuevos.map(n => {
        const local = itemPor(n.id);
        if(local && (cola.has(n.id) || (n.id === abierto && foco))) return local;
        return n;
      }).concat(items.filter(l => cola.has(l.id) && !nuevos.some(n => n.id === l.id)));
    }else{
      items = nuevos;
    }
    if(data.migrados) avisar('Pasé ' + data.migrados + ' videos y momentos del tablero anterior al flujo nuevo.');
    cargado = true; fallas = 0; setSync();
    renderBoard();
    if(abierto){
      const foco = document.activeElement && document.activeElement.closest && document.activeElement.closest('.sheet');
      if(!itemPor(abierto)) cerrar();
      else if(!silencioso || (!foco && !cola.has(abierto) && !rec)) renderSheet(true);
    }
  }catch(e){
    console.error(e);
    if(!silencioso){
      cargado = true; fallas = 1; setSync();
      $('#board').innerHTML = '<div class="empty" style="width:100%">No se pudo abrir la hoja del tablero. Revisa tu conexión y recarga la página.</div>';
    }
  }
}

/* =========================================================
   Avisos
   ========================================================= */
function avisar(txt, error, clave){
  const box = $('#avisos');
  if(clave && box.querySelector('[data-clave="' + clave + '"]')) return;
  const d = document.createElement('div');
  d.className = 'aviso' + (error ? ' err' : '');
  if(clave) d.dataset.clave = clave;
  d.setAttribute('role', 'status');
  d.innerHTML = '<span>' + esc(txt) + '</span><button aria-label="Cerrar aviso">×</button>';
  d.querySelector('button').onclick = () => d.remove();
  box.appendChild(d);
  if(!error) setTimeout(() => d.remove(), 9000);
}

/* =========================================================
   Mover entre estados
   ========================================================= */
function moverA(id, estado, extra){
  const it = itemPor(id); if(!it || it.estado === estado) { if(extra && extra.length) cambiar(id, extra); return; }
  const ops = (extra || []).slice();
  if(estado === 'archivado') ops.push({ op:'set', path:'archivado', value:{ motivo: (it.archivado && it.archivado.motivo) || '', desde: it.estado, fecha: new Date().toISOString() } });
  ops.push({ op:'set', path:'estado', value: estado });
  ops.push({ op:'push', path:'historial', value:{ id: uid('h'), estado, desde: it.estado, fecha: new Date().toISOString() } });
  cambiar(id, ops);
  renderBoard();
  if(abierto === id){ tab = tabPorDefecto(it); renderSheet(); }
}

/* =========================================================
   Tablero de columnas
   ========================================================= */
/* Mes al que pertenece un video: el mes en que se sube (o se subió).
   La fecha del concierto no cuenta. Si todavía no tiene fecha de publicación
   y sigue en el flujo, aparece en el mes actual para no perderlo de vista. */
function campoFechaPub(it){
  if(it.estado === 'publicado') return 'publicado.fecha';
  if(it.estado === 'publicar' || it.publicacion.fecha) return 'publicacion.fecha';
  return 'fechas.publicacion';
}
function mesDe(it){
  const f = it.publicado.fecha || it.publicacion.fecha || it.fechas.publicacion;
  const d = fechaLocal(f);
  if(d) return { mes: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'), conFecha: true };
  if(it.estado === 'publicado' || it.estado === 'archivado'){
    const c = fechaLocal(it.creado);
    if(c) return { mes: c.getFullYear() + '-' + String(c.getMonth()+1).padStart(2,'0'), conFecha: false };
  }
  return { mes: mesActual(), conFecha: false };
}
function mesNombre(m, corto){
  const [a, mm] = m.split('-').map(Number);
  const t = new Date(a, mm - 1, 1).toLocaleDateString('es-MX', corto ? { month:'short' } : { month:'long', year:'numeric' }).replace('.', '');
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function renderMeses(){
  const nav = $('#meses'); if(!nav) return;
  const cuenta = {};
  items.forEach(it => { if(it.estado === 'archivado' && !verArchivados) return; const m = mesDe(it).mes; cuenta[m] = (cuenta[m] || 0) + 1; });
  const meses = Object.keys(Object.assign({ [mesActual()]: 0 }, cuenta)).sort().reverse();
  if(mesActivo !== 'todos' && !meses.includes(mesActivo)) meses.push(mesActivo);
  const anioActual = mesActual().slice(0, 4);
  const total = Object.values(cuenta).reduce((a, b) => a + b, 0);
  nav.innerHTML = '<button class="mes" data-act="mes" data-a="todos" aria-pressed="' + (mesActivo === 'todos') + '">Todos <span class="n">' + total + '</span></button>'
    + meses.map(m => '<button class="mes" data-act="mes" data-a="' + m + '" aria-pressed="' + (mesActivo === m) + '">'
      + esc(m.slice(0, 4) === anioActual ? mesNombre(m, true) : mesNombre(m, true) + ' ' + m.slice(0, 4))
      + ' <span class="n">' + (cuenta[m] || 0) + '</span></button>').join('');
}
function coincide(it){
  if(mesActivo !== 'todos' && mesDe(it).mes !== mesActivo) return false;
  if(!filtro) return true;
  const t = [it.titulo, it.origen.notaJim, it.seleccion.queFue, it.instrucciones.guion, it.origen.concierto, fCorta(it.origen.concierto)].join(' ').toLowerCase();
  return filtro.split(/\s+/).every(p => t.includes(p));
}
function ordenar(k, lista){
  const f = (x, a) => (x || '') ;
  const por = {
    seleccion: (a, b) => f(b.origen.concierto).localeCompare(f(a.origen.concierto)) || f(a.origen.hora).localeCompare(f(b.origen.hora)),
    listo: (a, b) => f(a.fechas.entregaRevision || '9').localeCompare(f(b.fechas.entregaRevision || '9')),
    edicion: (a, b) => f(a.fechas.entregaRevision || '9').localeCompare(f(b.fechas.entregaRevision || '9')),
    publicar: (a, b) => f(a.publicacion.fecha || a.fechas.publicacion || '9').localeCompare(f(b.publicacion.fecha || b.fechas.publicacion || '9')),
    publicado: (a, b) => f(b.publicado.fecha || b.actualizado).localeCompare(f(a.publicado.fecha || a.actualizado))
  }[k] || ((a, b) => f(b.actualizado).localeCompare(f(a.actualizado)));
  return lista.slice().sort(por);
}

function chipFecha(etiqueta, iso, vigilar){
  if(!iso) return '';
  const d = diasHasta(iso);
  let cls = '';
  if(vigilar && d != null){ if(d < 0) cls = 'late'; else if(d <= 1) cls = 'warn'; }
  const extra = vigilar && d != null ? (d < 0 ? ' (vencida)' : d === 0 ? ' (hoy)' : d === 1 ? ' (mañana)' : '') : '';
  return '<span class="chip ' + cls + '">' + etiqueta + ' ' + esc(fCorta(iso)) + extra + '</span>';
}

function turnoRevision(it){
  const v = ultimaVersion(it);
  if(!v) return '';
  if(v.estado === 'cambios') return '<span class="chip turno">V' + v.n + ' con cambios: corrige el editor</span>';
  if(v.estado === 'pendiente') return '<span class="chip turno">V' + v.n + ' por revisar: revisa Toni</span>';
  return '';
}

function cardHtml(it){
  const v = ultimaVersion(it);
  const fuente = (v && v.drive) || it.origen.drive || '';
  const th = driveThumb(fuente);
  const k = it.estado;
  const chips = [];
  if(it.origen.concierto) chips.push('<span class="chip">Concierto ' + esc(fCorta(it.origen.concierto)) + (it.origen.hora ? ', ' + esc(String(it.origen.hora).slice(0,5)) : '') + '</span>');
  if(k === 'seleccion' && !it.origen.drive) chips.push('<span class="chip warn">Sin clip todavía</span>');
  if(k === 'seleccion' && it.seleccion.queFue) chips.push('<span class="chip ok">Toni ya lo describió</span>');
  if(k === 'instrucciones'){
    const n = CAMPOS_INSTR.filter(c => (it.instrucciones[c[0]] || '').trim()).length;
    chips.push('<span class="chip' + (n ? '' : ' warn') + '">' + (n ? n + ' de ' + CAMPOS_INSTR.length + ' campos' : 'Sin instrucciones') + '</span>');
  }
  if(['listo','edicion','revision'].includes(k)) chips.push(chipFecha('Entrega', it.fechas.entregaRevision, k !== 'revision'));
  if(['instrucciones','listo','edicion','revision','publicar'].includes(k)) chips.push(chipFecha('Se sube', it.publicacion.fecha || it.fechas.publicacion, k === 'publicar'));
  if(k === 'listo' && !it.fechas.entregaRevision && !it.fechas.publicacion) chips.push('<span class="chip warn">Faltan las fechas</span>');
  if(k === 'revision') chips.push(turnoRevision(it));
  if(k === 'publicado'){
    if(it.publicado.fecha) chips.push('<span class="chip ok">' + esc(fCorta(it.publicado.fecha)) + (it.publicado.plataforma ? ' en ' + esc(it.publicado.plataforma) : '') + '</span>');
    if(!it.publicado.enlace) chips.push('<span class="chip warn">Falta el enlace</span>');
  }
  if(k === 'archivado' && it.archivado.motivo) chips.push('<span class="chip">' + esc(it.archivado.motivo) + '</span>');
  if(it.adjuntos.length) chips.push('<span class="chip">' + it.adjuntos.length + (it.adjuntos.length === 1 ? ' archivo' : ' archivos') + '</span>');

  return '<button class="card" data-open="' + esc(it.id) + '" draggable="' + (!LECTURA) + '" style="--c:var(--s-' + k + ')">'
    + '<span class="thumb">'
    + (th ? '<img src="' + esc(th) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '')
    + '<span class="thumb-txt">' + (fuente ? '' : 'Sin video') + '</span>'
    + (v ? '<span class="ver">V' + v.n + '</span>' : '')
    + '</span>'
    + '<span class="card-body"><span class="card-title">' + esc(it.titulo || 'Sin nombre') + '</span>'
    + (chips.filter(Boolean).length ? '<span class="chips">' + chips.join('') + '</span>' : '')
    + '</span></button>';
}

function renderBoard(){
  const board = $('#board');
  if(!cargado) return;
  renderMeses();
  const visibles = items.filter(coincide);
  const cols = ESTADOS.filter(e => e.k !== 'archivado' || verArchivados).map(e => {
    let lista = ordenar(e.k, visibles.filter(it => it.estado === e.k));
    const total = lista.length;
    let mas = '';
    if(e.k === 'publicado' && !publicadosTodos && !filtro && lista.length > 12){
      lista = lista.slice(0, 12);
      mas = '<button class="btn sm ghost col-more" data-act="verPublicados">Ver los ' + total + '</button>';
    }
    return '<section class="col' + (e.k === 'archivado' ? ' arch' : '') + '" data-col="' + e.k + '" style="--c:var(--s-' + e.k + ')" aria-label="' + esc(e.n) + '">'
      + '<div class="col-head"><div class="col-title"><h2>' + esc(e.n) + '</h2><span class="col-n">' + total + '</span></div>'
      + '<p class="col-desc">' + esc(e.d) + '</p></div>'
      + '<div class="col-body">' + (lista.length ? lista.map(cardHtml).join('') : '<p class="col-empty">' + (filtro ? 'Nada coincide' : 'Vacío') + '</p>') + mas + '</div>'
      + '</section>';
  }).join('');
  const nArch = visibles.filter(it => it.estado === 'archivado').length;
  board.innerHTML = cols + '<button class="btn sm arch-toggle" data-act="toggleArch">' + (verArchivados ? 'Ocultar archivados' : 'Archivados (' + nArch + ')') + '</button>';
}

/* arrastrar tarjetas entre columnas (computadora) */
let arrastrando = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.card[data-open]');
  if(!c || LECTURA) return;
  arrastrando = c.dataset.open; c.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', arrastrando); }catch(_){}
});
document.addEventListener('dragend', e => {
  arrastrando = null;
  document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
  document.querySelectorAll('.col.drop').forEach(x => x.classList.remove('drop'));
});
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.col');
  if(!col || !arrastrando) return;
  e.preventDefault();
  document.querySelectorAll('.col.drop').forEach(x => x !== col && x.classList.remove('drop'));
  col.classList.add('drop');
});
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.col');
  if(!col || !arrastrando) return;
  e.preventDefault();
  const id = arrastrando; arrastrando = null;
  col.classList.remove('drop');
  moverA(id, col.dataset.col);
});

/* =========================================================
   Detalle de un video
   ========================================================= */
const TABS = [
  { k:'momento', n:'Momento' },
  { k:'instrucciones', n:'Instrucciones' },
  { k:'versiones', n:'Versiones' },
  { k:'publicacion', n:'Publicación' }
];
function tabPorDefecto(it){
  return ({ seleccion:'momento', instrucciones:'instrucciones', listo:'instrucciones', edicion:'versiones', revision:'versiones', publicar:'publicacion', publicado:'publicacion', archivado:'momento' })[it.estado] || 'momento';
}

function abrir(id, sinHistorial){
  const it = itemPor(id); if(!it) return;
  abierto = id; tab = tabPorDefecto(it);
  if(!sinHistorial) history.replaceState(null, '', '#v=' + encodeURIComponent(id));
  document.body.style.overflow = 'hidden';
  animarHoja = true;
  renderSheet();
}
function cerrar(){
  if(rec){ alert('Primero detén la grabación de audio.'); return; }
  enviarTodo();
  abierto = null;
  $('#sheet-root').innerHTML = '';
  document.body.style.overflow = '';
  history.replaceState(null, '', location.pathname + location.search);
  renderBoard();
}

function railHtml(it){
  const arch = it.estado === 'archivado';
  const actual = arch ? -1 : EST[it.estado].i;
  return '<ol class="rail' + (arch ? ' archivado' : '') + '" aria-label="Estado del video">' + ESTADOS.filter(e => e.k !== 'archivado').map((e, i) => {
    const cls = i < actual ? 'done' : (i === actual ? 'now' : '');
    return '<li class="' + cls + '" style="--c:var(--s-' + e.k + ')"><button ' + (LECTURA ? 'disabled' : 'data-act="railMover" data-a="' + e.k + '"') + ' aria-current="' + (i === actual ? 'step' : 'false') + '" title="' + (i === actual ? 'Estado actual' : 'Mover a ' + esc(e.n)) + '"><span class="bar"></span><span class="lab">' + esc(e.n) + '</span></button></li>';
  }).join('') + '</ol>';
}

function nextHtml(it){
  const k = it.estado;
  const v = ultimaVersion(it);
  let txt = '', btns = '';
  if(k === 'seleccion'){
    txt = '<b>¿Este momento sirve para un video?</b> Si sirve pasa a Pendiente de instrucciones.';
    btns = '<button class="btn" data-act="noSirve">No sirve</button><button class="btn primary" data-act="sirve">Sirve</button>';
  }else if(k === 'instrucciones'){
    const n = CAMPOS_INSTR.filter(c => (it.instrucciones[c[0]] || '').trim()).length;
    txt = n ? '<b>' + n + ' de ' + CAMPOS_INSTR.length + ' campos llenos.</b> Cuando esté todo, márcalo listo para editar.' : '<b>Falta todo lo que necesita el editor:</b> guion, instrucciones y material.';
    btns = '<button class="btn primary" data-act="mover" data-a="listo">Marcar listo para editar</button>';
  }else if(k === 'listo'){
    const f = it.fechas;
    txt = (f.entregaRevision || f.publicacion)
      ? '<b>Listo para el editor.</b>' + (f.entregaRevision ? ' Entrega de revisión: ' + esc(fCorta(f.entregaRevision)) + '.' : '') + (f.publicacion ? ' Publicación: ' + esc(fCorta(f.publicacion)) + '.' : '')
      : '<b>Pon las dos fechas</b> en Instrucciones: entrega de revisión y publicación.';
    btns = '<button class="btn primary" data-act="mover" data-a="edicion">Empezar edición</button>';
  }else if(k === 'edicion'){
    txt = '<b>El editor está trabajando.</b> Cuando la primera versión esté lista, súbela en Versiones.' + (it.fechas.entregaRevision ? ' Entrega: ' + esc(fCorta(it.fechas.entregaRevision)) + '.' : '');
    btns = '<button class="btn primary" data-act="irNuevaVersion">Subir versión</button>';
  }else if(k === 'revision'){
    if(!v){ txt = '<b>Todavía no hay versiones.</b>'; btns = '<button class="btn primary" data-act="irNuevaVersion">Subir versión</button>'; }
    else if(v.estado === 'cambios'){
      txt = '<b>Toni pidió cambios en la V' + v.n + '.</b> El editor sube la V' + (v.n + 1) + ' cuando esté lista.';
      btns = '<button class="btn primary" data-act="irNuevaVersion">Subir V' + (v.n + 1) + '</button>';
    }else{
      txt = '<b>La V' + v.n + ' está esperando la revisión de Toni.</b>';
      btns = '<button class="btn" data-act="pedirCambios" data-a="' + v.id + '">Pedir cambios</button><button class="btn primary" data-act="aprobar" data-a="' + v.id + '">Aprobar V' + v.n + '</button>';
    }
  }else if(k === 'publicar'){
    txt = '<b>Aprobado.</b> Completa los datos de publicación y márcalo cuando ya esté arriba.';
    btns = '<button class="btn primary" data-act="publicar">Marcar como publicado</button>';
  }else if(k === 'publicado'){
    const p = it.publicado;
    txt = '<b>Publicado' + (p.fecha ? ' el ' + esc(fCorta(p.fecha)) : '') + (p.plataforma ? ' en ' + esc(p.plataforma) : '') + '.</b>' + (p.enlace ? '' : ' Falta pegar el enlace a la publicación.');
    btns = p.enlace ? '<a class="btn" href="' + esc(p.enlace) + '" target="_blank" rel="noopener">Abrir publicación</a>' : '';
  }else if(k === 'archivado'){
    const desde = EST[it.archivado.desde] ? EST[it.archivado.desde].n : 'Selección';
    txt = '<b>Archivado.</b> Está fuera del flujo pero no se borró nada.';
    btns = '<button class="btn primary" data-act="recuperar">Regresar a ' + esc(desde) + '</button>';
  }
  return '<div class="next" style="--c:var(--s-' + k + ')"><p>' + txt + '</p>' + (LECTURA ? '' : btns) + '</div>';
}

function tabsHtml(it){
  const n = { versiones: it.versiones.length || '', momento: '', instrucciones: '', publicacion: '' };
  return '<div class="tabs" role="tablist">' + TABS.map(t =>
    '<button role="tab" aria-selected="' + (tab === t.k) + '" data-act="tab" data-a="' + t.k + '">' + t.n + (n[t.k] ? '<span class="n">' + n[t.k] + '</span>' : '') + '</button>'
  ).join('') + '</div>';
}

function renderSheet(conservarScroll){
  const it = itemPor(abierto); if(!it) return;
  const root = $('#sheet-root');
  const prev = root.querySelector('.sheet-body');
  const scroll = prev && conservarScroll !== false ? prev.scrollTop : 0;
  const desde = EST[it.estado];
  root.innerHTML = '<div class="sheet-wrap" data-act="fondo"><div class="sheet' + (animarHoja ? ' entra' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(it.titulo) + '" style="--c:var(--s-' + it.estado + ')">'
    + '<div class="sheet-head">'
    + '<div class="sh-row">'
    + '<button class="btn ghost" data-act="cerrar" aria-label="Cerrar">← Tablero</button>'
    + '<input class="sh-title" value="' + esc(it.titulo) + '" data-path="titulo" aria-label="Nombre del video" ' + (LECTURA ? 'readonly' : '') + '>'
    + (LECTURA ? '' : '<div class="menu"><button class="btn ghost" data-act="menuVideo" aria-haspopup="true">Opciones</button><div class="menu-list" id="menu-video" hidden>'
      + '<label style="cursor:default">Mover a<select class="inp" style="margin-top:6px" data-act-change="moverSelect">' + ESTADOS.map(e => '<option value="' + e.k + '"' + (e.k === it.estado ? ' selected' : '') + '>' + esc(e.n) + '</option>').join('') + '</select></label>'
      + (it.estado !== 'archivado' ? '<button data-act="archivar">Archivar</button>' : '')
      + '<hr><button data-act="eliminar" style="color:var(--danger)">Eliminar del tablero</button>'
      + '</div></div>')
    + '</div>'
    + '<p class="sh-sub">' + esc(desde.n) + (it.origen.concierto ? '. Concierto del ' + esc(fLarga(it.origen.concierto).toLowerCase()) + '.' : '.')
    + '<span class="mes-ctl"><label for="f-pubmes">Se sube:</label>' + (LECTURA ? esc(fCorta(get(it, campoFechaPub(it))) || 'sin fecha')
      : '<input id="f-pubmes" type="date" data-path="' + campoFechaPub(it) + '" value="' + esc(get(it, campoFechaPub(it)) || '') + '">')
    + '<span class="st">' + (mesDe(it).conFecha ? 'Cuenta en ' + esc(mesNombre(mesDe(it).mes).toLowerCase()) : 'Sin fecha: se ve en el mes actual') + '</span></span></p>'
    + railHtml(it)
    + nextHtml(it)
    + '</div>'
    + tabsHtml(it)
    + '<div class="sheet-body">' + cuerpoTab(it) + '</div>'
    + '</div></div>';
  animarHoja = false;
  const rail = root.querySelector('.rail'), ahora = rail && rail.querySelector('.now');
  if(ahora && rail.scrollWidth > rail.clientWidth) rail.scrollLeft = ahora.offsetLeft - (rail.clientWidth - ahora.offsetWidth) / 2;
  const body = root.querySelector('.sheet-body');
  if(body) body.scrollTop = scroll;
  if(LECTURA) root.querySelectorAll('.inp, textarea').forEach(x => { x.readOnly = true; if(x.tagName === 'SELECT') x.disabled = true; });
}

function cuerpoTab(it){
  if(tab === 'instrucciones') return tabInstrucciones(it);
  if(tab === 'versiones') return tabVersiones(it);
  if(tab === 'publicacion') return tabPublicacion(it);
  return tabMomento(it);
}

/* ---------- video ---------- */
function videoHtml(url, vertical, vacio){
  const emb = driveEmbed(url);
  if(!emb) return '<div class="frame-empty">' + vacio + '</div>';
  return '<div class="frame ' + (vertical ? 'v' : 'h') + '"><iframe src="' + esc(emb) + '" allow="autoplay; fullscreen" allowfullscreen title="Video"></iframe></div>'
    + '<div class="vid-links"><a class="btn sm" href="' + esc(driveVer(url)) + '" target="_blank" rel="noopener">Abrir en Drive</a></div>';
}
function campo(it, path, etiqueta, opts){
  opts = opts || {};
  const val = get(it, path);
  const tipo = opts.tipo || 'textarea';
  const ph = opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '';
  const id = 'f-' + path.replace(/[^\w]/g, '_');
  let control;
  if(tipo === 'textarea') control = '<textarea class="inp" id="' + id + '" data-path="' + esc(path) + '"' + ph + ' rows="' + (opts.rows || 2) + '">' + esc(val || '') + '</textarea>';
  else control = '<input class="inp" id="' + id + '" type="' + tipo + '" data-path="' + esc(path) + '" value="' + esc(val || '') + '"' + ph + (opts.list ? ' list="' + opts.list + '"' : '') + '>';
  return '<label class="field" for="' + id + '"><span>' + esc(etiqueta) + '</span>' + control + '</label>';
}

/* ---------- pestaña Momento ---------- */
function tabMomento(it){
  const o = it.origen;
  const datos = [
    ['Concierto', o.concierto ? fLarga(o.concierto) : ''],
    ['Clic del pedal', o.hora ? o.hora + (Number(o.pisadas) > 1 ? ' (' + o.pisadas + ' pisadas)' : '') : ''],
    ['Video original', o.video],
    ['Rango del clip', o.rango],
    ['Momento en el video', o.momentoVideo],
    ['Archivo del clip', o.clip]
  ].filter(d => d[1]);
  const dec = it.seleccion.decision;
  const clip = videoHtml(o.drive, false, LECTURA ? 'El clip de este momento todavía no está listo.' : 'Este momento todavía no tiene clip. ' + (o.clip ? 'Súbelo a Drive como <b>' + esc(o.clip) + '</b> y usa Más → Buscar clips en Drive, o pega el link abajo.' : 'Pega el link de Drive abajo.'));
  return '<div class="grid">'
    + '<div class="vid-col">' + clip
    + (LECTURA ? '' : '<div class="links"><h4>Link del clip</h4>' + campo(it, 'origen.drive', 'Link de Drive del clip', { tipo:'url', ph:'https://drive.google.com/file/d/…' }) + '</div>')
    + '</div>'
    + '<div>'
    + '<div class="panel"><h3>' + (o.concierto ? esc(fLarga(o.concierto)) : 'Momento') + '</h3>'
    + (datos.length ? '<dl class="datos">' + datos.map(d => '<dt>' + esc(d[0]) + '</dt><dd>' + esc(d[1]) + '</dd>').join('') + '</dl>' : '<p class="hint">Sin datos del pedal.</p>')
    + campo(it, 'origen.notaJim', 'Nota de Jim', { ph:'Lo que viste tú en este momento' })
    + '</div>'
    + '<div class="panel"><h3>¿Qué pasa en este momento?</h3><p class="hint">Quién toca, qué se ve, qué reacción hubo y por qué llamó la atención. Esto alimenta el guion.</p>'
    + (LECTURA ? '' : '<div class="decide"><button class="btn no' + (dec === 'no sirve' ? ' on' : '') + '" data-act="decidir" data-a="no sirve" aria-pressed="' + (dec === 'no sirve') + '">No sirve</button><button class="btn si' + (dec === 'sirve' ? ' on' : '') + '" data-act="decidir" data-a="sirve" aria-pressed="' + (dec === 'sirve') + '">Sirve</button></div>')
    + campo(it, 'seleccion.queFue', 'Descripción', { rows:4, ph:'Ej. El trombón hace un solo y Toni le marca la entrada al piano' })
    + '</div>'
    + adjuntosPanel(it, 'momento', 'Audios y archivos del momento', 'Graba un audio explicando lo que quieres de este momento o sube fotos y referencias.')
    + '</div></div>';
}

/* ---------- pestaña Instrucciones ---------- */
function tabInstrucciones(it){
  const destaca = it.estado === 'listo' || it.estado === 'instrucciones';
  return '<div class="grid">'
    + '<div class="vid-col">' + videoHtml(it.origen.drive, false, 'Sin clip de referencia.')
    + '<div class="fechas' + (destaca ? ' destaca' : '') + '"><h3 style="font-family:var(--display);font-size:16px;margin:0 0 10px">Fechas</h3>'
    + campo(it, 'fechas.entregaRevision', 'Fecha de entrega de revisión', { tipo:'date' })
    + campo(it, 'fechas.publicacion', 'Fecha de publicación', { tipo:'date' })
    + '</div></div>'
    + '<div>'
    + '<div class="panel"><h3>Lo que necesita el editor</h3><p class="hint">Todo lo que haga falta para editar sin tener que preguntar.</p>'
    + CAMPOS_INSTR.map(c => campo(it, 'instrucciones.' + c[0], c[1], { ph:c[2], rows: c[0] === 'guion' || c[0] === 'instrucciones' ? 4 : 2 })).join('')
    + '</div>'
    + adjuntosPanel(it, 'instrucciones', 'Material', 'Grabaciones, imágenes, logos o audios con indicaciones. Hasta 25 MB por archivo; lo más pesado, súbelo a Drive y pega el link arriba.')
    + '</div></div>';

/* ---------- adjuntos ---------- */
function adjuntosPanel(it, seccion, titulo, hint){
  const lista = it.adjuntos.filter(a => (a.seccion || 'momento') === seccion);
  const items_ = lista.map(a => {
    const audio = a.tipo === 'audio' || /^audio\//.test(a.mime || '');
    return '<div class="adj-item"><div class="adj-head"><span class="nm" title="' + esc(a.nombre) + '">' + esc(a.nombre || 'Archivo') + '</span>'
      + '<a href="https://drive.google.com/file/d/' + encodeURIComponent(a.driveId) + '/view" target="_blank" rel="noopener">Abrir</a>'
      + '<a href="https://drive.google.com/uc?export=download&id=' + encodeURIComponent(a.driveId) + '" target="_blank" rel="noopener">Descargar</a>'
      + (LECTURA ? '' : '<button data-act="quitarAdj" data-a="' + esc(a.id) + '">Quitar</button>')
      + '</div>' + (audio ? '<iframe src="https://drive.google.com/file/d/' + encodeURIComponent(a.driveId) + '/preview" title="Audio"></iframe>' : '') + '</div>';
  }).join('');

      + '<label class="btn">Subir archivo<input type="file" multiple data-subir="' + seccion + '"></label><span class="st" id="st-adj-' + seccion + '" role="status"></span></div>')
    + '</div>';

/* ---------- pestaña Versiones ---------- */
function verEstado(v){
  if(v.estado === 'aprobada') return '<span class="pill ok">Aprobada</span>';
  if(v.estado === 'cambios') return '<span class="pill flag">Cambios pedidos</span>';
  return '<span class="pill wait">Por revisar</span>';
}
function colorVer(v){ return v.estado === 'aprobada' ? 'var(--ok)' : v.estado === 'cambios' ? 'var(--danger)' : 'var(--brass)'; }
function lineaPill(s){
  if(s === 'aprobado') return ['pill ok', 'Aprobada'];
  if(s === 'cambio solicitado') return ['pill flag', 'Cambiar'];
  return ['pill', 'Sin revisar'];
}

function tabVersiones(it){
  const vs = it.versiones;
  const formNueva = (!vs.length || ultimaVersion(it).estado === 'cambios') && !LECTURA && !['publicar','publicado'].includes(it.estado);
  let sel = verSel[it.id];
  if(sel === 'nueva' && !formNueva) sel = null;
  if(sel !== 'nueva' && !vs.some(v => v.id === sel)) sel = vs.length ? vs[vs.length - 1].id : (formNueva ? 'nueva' : null);
  verSel[it.id] = sel;
  const chips = vs.map(v => '<button data-act="verSel" data-a="' + v.id + '" aria-pressed="' + (sel === v.id) + '"><span class="dot" style="background:' + colorVer(v) + '"></span>V' + v.n + '</button>').join('')
    + (formNueva ? '<button data-act="verSel" data-a="nueva" aria-pressed="' + (sel === 'nueva') + '">+ V' + (vs.length + 1) + '</button>' : '');
  if(!sel) return '<div class="panel empty">Todavía no hay versiones.</div>';
  const nav = '<div class="vers" role="group" aria-label="Versiones">' + chips + '</div>';
  if(sel === 'nueva') return '<div class="grid solo"><div>' + nav + formVersion(it) + '</div></div>';
  const v = vs.find(x => x.id === sel);
  const esUltima = v === ultimaVersion(it);
  const editable = esUltima && !LECTURA;
  return '<div class="grid">'
    + '<div class="vid-col">' + videoHtml(v.drive, true, 'Esta versión no tiene link de video.')
    + (driveDescarga(v.driveHD) ? '<a class="btn sm" href="' + esc(driveDescarga(v.driveHD)) + '" target="_blank" rel="noopener">Descargar en HD</a>' : '')
    + '</div>'
    + '<div>' + nav + linksVersion(it, v) + versionDetalle(it, v, editable) + '</div></div>';
}

function linksVersion(it, v){
  if(LECTURA) return '';
  const P = 'versiones.@' + v.id + '.';
  const ver = u => driveVer(u) ? ' <a href="' + esc(driveVer(u)) + '" target="_blank" rel="noopener">Abrir</a>' : '';
  return '<div class="links"><h4>Links de la V' + v.n + '</h4><div class="row2">'
    + '<label class="field" for="lk-' + v.id + '-r"><span>Video para revisión' + ver(v.drive) + '</span><input class="inp" id="lk-' + v.id + '-r" type="url" data-path="' + P + 'drive" value="' + esc(v.drive || '') + '" placeholder="https://drive.google.com/file/d/…"></label>'

function campoV(path, etiqueta, val, editable, ph, tipo, rows){
  const id = 'f-' + path.replace(/[^\w]/g, '_');

    ? '<input class="inp" id="' + id + '" type="' + tipo + '" data-path="' + esc(path) + '" value="' + esc(val || '') + '" placeholder="' + esc(ph || '') + '"' + ro + '>'

function cambiarDecision(dec, desdeBoton){
  const it = itemPor(abierto);
  const nueva = desdeBoton && it.seleccion.decision === dec ? '' : dec;
  const ops = [{ op:'set', path:'seleccion.decision', value: nueva }];
  if(it.estado === 'seleccion' && nueva === 'sirve') return moverA(it.id, 'instrucciones', ops);
  if(it.estado === 'seleccion' && nueva === 'no sirve'){
    ops.push({ op:'set', path:'archivado.motivo', value:'No sirve' });
    moverA(it.id, 'archivado', ops);
    cambiar(it.id, [{ op:'set', path:'archivado.motivo', value:'No sirve' }]);
    renderSheet(); return;
  }
  cambiar(it.id, ops);
  renderSheet(); renderBoard();
}

/* ---------- versiones ---------- */
let nvTiempos = [];
function parseSrt(content){
  const bloques = content.replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = [];
  bloques.forEach(b => {
    const rows = b.split('\n'); let i = 0;
    if(/^\d+$/.test(rows[0].trim())) i = 1;
    let times = '';
    if(rows[i] && rows[i].includes('-->')){ times = rows[i].trim(); i++; }
    const text = rows.slice(i).join(' ').replace(/<[^>]+>/g, '').trim();
    if(text) out.push({ text, times });
  });
  return out;
}

function enviarVersion(){
  const it = itemPor(abierto);
  const drive = $('#nv-drive').value.trim();
  const st = $('#nv-st');
  if(!driveId(drive)){ st.textContent = 'Pega el link de Drive del video.'; st.className = 'st err'; $('#nv-drive').focus(); return; }
  const prev = ultimaVersion(it);
  const n = (prev ? prev.n : 0) + 1;
  const textos = $('#nv-guion').value.split('\n').map(t => t.trim()).filter(Boolean);
  const v = {
    id: uid('ver'), n, drive, driveHD: $('#nv-hd').value.trim(), fecha: new Date().toISOString(),
    estado:'pendiente', notaEditor: $('#nv-nota').value.trim(),
    scriptLines: textos.map((text, i) => ({ id: uid('l' + i + '_'), text, status:'pendiente', comment:'', times: nvTiempos[i] || '' })),
    copy: $('#nv-copy').value.trim(), copyStatus:'pendiente', copyComment:'',
    timestampComments: [], audioNotes: [], generalComment:'', cambios:''
  };
  nvTiempos = [];
  verSel[it.id] = v.id;
  const ops = [{ op:'push', path:'versiones', value: v }];
  if(it.estado !== 'revision') moverA(it.id, 'revision', ops);
  else { cambiar(it.id, ops); renderSheet(false); renderBoard(); }
}

function srtTiempo(sec){
  const h = String(Math.floor(sec/3600)).padStart(2,'0'), m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s = String(Math.floor(sec%60)).padStart(2,'0'), ms = String(Math.round((sec%1)*1000)).padStart(3,'0');
  return h + ':' + m + ':' + s + ',' + ms;
}
function srtSeg(t){ const m = (t || '').match(/(\d{2}):(\d{2}):(\d{2})[,.](\d{3})/); return m ? (+m[1])*3600 + (+m[2])*60 + (+m[3]) + (+m[4])/1000 : null; }
function bajar(nombre, contenido, tipo){
  const blob = new Blob([contenido], { type: tipo });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function descargarSrt(verId){
  const it = itemPor(abierto); const v = it.versiones.find(x => x.id === verId);
  let cursor = 0;
  const srt = v.scriptLines.map((l, i) => {
    let t = l.times;
    if(t){ const fin = srtSeg((t.split('-->')[1] || '').trim()); if(fin !== null) cursor = fin; }
    else { t = srtTiempo(cursor) + ' --> ' + srtTiempo(cursor + 2.2); cursor += 2.2; }
    const texto = (l.comment && l.comment.trim()) ? l.comment.trim() : l.text;
    return (i + 1) + '\n' + t + '\n' + texto;
  }).join('\n\n') + '\n';
  bajar((it.titulo || 'video').replace(/[^\w\-]+/g, '_') + '_V' + v.n + '_corregido.srt', srt, 'text/plain;charset=utf-8');
}

/* ---------- archivos y audios ---------- */
function blobToBase64(blob){
  return new Promise((ok, mal) => { const r = new FileReader(); r.onloadend = () => ok(String(r.result).split(',')[1]); r.onerror = mal; r.readAsDataURL(blob); });
}
async function subirADrive(blob, nombre){
  const base64 = await blobToBase64(blob);
  const r = await api({ action:'uploadArchivo', base64, mimeType: blob.type || 'application/octet-stream', nombre });
  return r.driveId;
}
function estadoEn(idEl, txt, err){ const e = document.getElementById(idEl); if(e){ e.textContent = txt; e.className = 'st' + (err ? ' err' : ''); } }

async function subirArchivos(seccion, input){
  const id = abierto;
  const files = [...input.files]; input.value = '';
  if(!files.length) return;
  const grandes = files.filter(f => f.size > ADJ_MAX);
  const stId = 'st-adj-' + seccion;
  if(grandes.length){ estadoEn(stId, grandes.map(f => f.name).join(', ') + ' pesa más de 25 MB. Súbelo a Drive y pega el link en las instrucciones.', true); return; }
  try{
    for(let i = 0; i < files.length; i++){
      const f = files[i];
      estadoEn(stId, 'Subiendo ' + (files.length > 1 ? (i + 1) + ' de ' + files.length + ': ' : '') + f.name + ' (' + tamLegible(f.size) + ')…');
      const driveId_ = await subirADrive(f, f.name);
      cambiar(id, [{ op:'push', path:'adjuntos', value:{ id: uid('a'), driveId: driveId_, nombre: f.name, mime: f.type || '', tipo: /^audio\//.test(f.type) ? 'audio-subido' : 'archivo', tam: f.size, seccion, creado: new Date().toISOString() } }]);
    }
    if(abierto === id) renderSheet();
    renderBoard();
    estadoEn(stId, 'Guardado');
  }catch(e){ console.error(e); estadoEn(stId, 'No se pudo subir. Revisa tu conexión e intenta de nuevo.', true); }
}

async function toggleGrabar(destino){
  if(rec){ if(rec.destino === destino) rec.mr.stop(); else alert('Ya hay una grabación en curso.'); return; }
  const stId = destino.startsWith('adj:') ? 'st-adj-' + destino.slice(4) : 'st-aud-' + destino.slice(4);
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){ estadoEn(stId, 'No se pudo usar el micrófono. Revisa los permisos del navegador para esta página.', true); return; }
  const tipo = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  const mr = tipo ? new MediaRecorder(stream, { mimeType: tipo }) : new MediaRecorder(stream);
  const id = abierto;
  rec = { destino, id, mr, stream, chunks: [], t0: Date.now(), timer: null };
  mr.ondataavailable = e => { if(e.data && e.data.size) rec.chunks.push(e.data); };
  mr.onstop = async () => {
    const r = rec; clearInterval(r.timer); r.stream.getTracks().forEach(t => t.stop()); rec = null;
    const mime = (mr.mimeType || 'audio/webm').split(';')[0];
    const ext = mime.includes('mp4') ? 'm4a' : mime.includes('ogg') ? 'ogg' : 'webm';
    const blob = new Blob(r.chunks, { type: mime });
    if(abierto === id) renderSheet();
    if(!blob.size){ estadoEn(stId, 'La grabación quedó vacía. Intenta de nuevo.', true); return; }
    const d = new Date();
    const nombre = 'Audio ' + d.toLocaleDateString('es-MX') + ' ' + String(d.getHours()).padStart(2,'0') + 'h' + String(d.getMinutes()).padStart(2,'0') + '.' + ext;
    estadoEn(stId, 'Subiendo audio…');
    try{
      const did = await subirADrive(blob, nombre);
      if(destino.startsWith('adj:')) cambiar(id, [{ op:'push', path:'adjuntos', value:{ id: uid('a'), driveId: did, nombre, mime, tipo:'audio', tam: blob.size, seccion: destino.slice(4), creado: d.toISOString() } }]);
      else cambiar(id, [{ op:'push', path:'versiones.@' + destino.slice(4) + '.audioNotes', value:{ id: uid('a'), driveId: did, nombre, creado: d.toISOString() } }]);
      if(abierto === id) renderSheet();
      estadoEn(stId, 'Audio guardado');
    }catch(e){ console.error(e); estadoEn(stId, 'No se pudo subir el audio. Intenta de nuevo.', true); }
  };
  mr.start(1000);
  renderSheet();
  rec.timer = setInterval(() => { const s = Math.floor((Date.now() - rec.t0) / 1000); estadoEn(stId, 'Grabando ' + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0')); }, 500);
}

/* ---------- importar, buscar clips, exportar ---------- */
async function importarArchivo(input){
  const file = input.files[0]; input.value = '';
  $('#mas-menu').hidden = true;
  if(!file) return;
  let datos;
  try{ datos = JSON.parse(await file.text()); }catch(e){ avisar('Ese archivo no se pudo leer. Usa el que descarga Marcas de Toni con el botón Descargar para el tablero.', true); return; }
  const lista = datos && datos.tipo === 'marcas-toni' && Array.isArray(datos.momentos) ? datos.momentos : null;
  if(!lista || !lista.length){ avisar('El archivo no trae momentos de Marcas de Toni.', true); return; }
  const momentos = lista.map(x => ({
    id: String(x.id), drive: x.drive || '', concierto: x.concierto || x.fecha || '', hora: x.horaClic || '',
    notaJim: x.queVi || '', video: x.video || '', rango: x.rango || '', momentoVideo: x.momento || '',
    clip: x.clip || '', clic: x.clic || '', pisadas: x.pisadas != null ? String(x.pisadas) : ''
  }));
  avisar('Importando ' + momentos.length + ' momentos…');
  try{
    const r = await api({ action:'importarFlujo', momentos });
    let t = 'Importé ' + r.agregados + (r.agregados === 1 ? ' momento a Selección.' : ' momentos a Selección.');
    if(r.repetidos) t += ' ' + r.repetidos + ' ya estaban y no los dupliqué.';
    const sin = r.agregados - r.conClip;
    if(sin > 0) t += sin === 1 ? ' 1 no tiene clip todavía: súbelo a Drive con su nombre y usa Buscar clips en Drive.' : ' ' + sin + ' no tienen clip todavía: súbelos a Drive con su nombre y usa Buscar clips en Drive.';
    avisar(t);
    await cargar();
  }catch(e){ console.error(e); avisar('No se pudo importar. Revisa que el Apps Script nuevo esté implementado.', true); }
}

async function buscarClips(btn){
  $('#mas-menu').hidden = true;
  avisar('Buscando los clips en Drive…');
  try{
    const r = await api({ action:'buscarClipsFlujo' });
    avisar(r.encontrados ? 'Encontré ' + r.encontrados + (r.encontrados === 1 ? ' clip' : ' clips') + ' en Drive.' + (r.faltan ? ' Faltan ' + r.faltan + '.' : '') : (r.faltan ? 'No encontré los ' + r.faltan + ' clips que faltan. Revisa que estén subidos con el mismo nombre.' : 'Todos los momentos ya tienen su clip.'));
    await cargar();
  }catch(e){ console.error(e); avisar('No se pudo buscar en Drive. Revisa tu conexión.', true); }
}

function exportarCorrecciones(){
  $('#mas-menu').hidden = true;
  const con = items.filter(it => it.versiones.length);
  if(!con.length){ alert('Todavía no hay versiones con correcciones.'); return; }
  const est = s => s === 'aprobado' ? 'aprobado' : s === 'cambio solicitado' ? 'cambio solicitado' : 'sin marcar';
  let md = '# Correcciones de Toni\n\nExportado el ' + hoyISO() + ' desde el tablero. Cada versión con su guion, copy y comentarios de Toni.\n\n---\n\n';
  con.forEach(it => {
    md += '## ' + it.titulo + '\n\n- Estado: **' + EST[it.estado].n + '**\n';
    if(it.seleccion.queFue) md += '- Qué pasa en el momento: ' + it.seleccion.queFue.replace(/\n/g, ' ') + '\n';
    if(it.instrucciones.guion) md += '- Guion pedido: ' + it.instrucciones.guion.replace(/\n/g, ' / ') + '\n';
    md += '\n';
    it.versiones.forEach(v => {
      md += '### V' + v.n + ' (' + (v.estado === 'aprobada' ? 'aprobada' : v.estado === 'cambios' ? 'cambios pedidos' : 'por revisar') + ')\n\n';
      v.scriptLines.forEach((l, i) => {
        md += '**' + String(i + 1).padStart(2, '0') + '.** ' + l.text + '\n- Veredicto: ' + est(l.status) + '\n';
        if((l.comment || '').trim()) md += '- Comentario de Toni: ' + l.comment.trim().replace(/\n/g, ' ') + '\n';
        md += '\n';
      });
      if((v.copy || '').trim()){ md += '**Copy**\n\n```\n' + v.copy.trim() + '\n```\n- Veredicto: ' + est(v.copyStatus) + '\n'; if((v.copyComment || '').trim()) md += '- Comentario de Toni: ' + v.copyComment.trim().replace(/\n/g, ' ') + '\n'; md += '\n'; }
      if(v.timestampComments.length){ md += '**Comentarios por segundo**\n\n'; v.timestampComments.forEach(c => { md += '- ' + [c.time, c.type].filter(Boolean).map(x => '(' + x + ') ').join('') + (c.comment || '').replace(/\n/g, ' ') + '\n'; }); md += '\n'; }
      if((v.cambios || '').trim()) md += '**Cambios solicitados**\n\n' + v.cambios.trim() + '\n\n';
      if((v.generalComment || '').trim()) md += '**Comentario general**\n\n' + v.generalComment.trim() + '\n\n';
    });
    md += '---\n\n';
  });
  bajar('correcciones-toni-' + hoyISO() + '.md', md, 'text/markdown;charset=utf-8');
}

  const filas = lista.map(g => '<div class="lk-grupo"><span class="dot" style="background:var(--s-' + g.e.k + ')"></span>' + esc(g.e.n) + '</div>'

    + '<div class="modal-actions"><button class="btn primary" data-act="cerrarModal">Listo</button></div>'
    + '</div></div>';
}

ACCIONES.cerrarModal = (el, e) => { if(e.target === el || el.tagName === 'BUTTON') $('#modal-root').innerHTML = ''; };
ACCIONES.crear = async (el) => {
  const titulo = $('#nm-titulo').value.trim();
  if(!titulo){ $('#nm-st').textContent = 'Ponle un nombre.'; $('#nm-st').className = 'st err'; $('#nm-titulo').focus(); return; }
  const estado = $('#nm-estado').value;
  const t = new Date().toISOString();
  const it = normalizar({
    id: uid('v'), estado, titulo, creado: t, actualizado: t,
    historial: [{ id: uid('h'), estado, fecha: t }],
    origen: { drive: $('#nm-drive').value.trim(), concierto: $('#nm-fecha').value, hora: $('#nm-hora').value.trim() },
    seleccion: { decision: estado === 'seleccion' ? '' : 'sirve', queFue: '' }
  });
  el.disabled = true; $('#nm-st').textContent = 'Guardando…'; $('#nm-st').className = 'st';
  try{
    await api({ action:'crearItem', item: it });
    items.push(it);
    $('#modal-root').innerHTML = '';
    renderBoard(); abrir(it.id);
  }catch(e){ console.error(e); el.disabled = false; $('#nm-st').textContent = 'No se pudo guardar. Revisa tu conexión.'; $('#nm-st').className = 'st err'; }
};

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('click', e => {
  const abrirEl = e.target.closest('[data-open]');
  if(abrirEl){ abrir(abrirEl.dataset.open); return; }
  const el = e.target.closest('[data-act]');
  if(!e.target.closest('.menu')) document.querySelectorAll('.menu-list').forEach(m => m.hidden = true);
  if(!el) return;
  const fn = ACCIONES[el.dataset.act];
  if(!fn) return;
  if(el.dataset.act === 'fondo' || el.dataset.act === 'cerrarModal'){ fn(el, e); return; }
  if(el.tagName !== 'A') e.preventDefault();
  fn(el, e);
});
$('#mas-btn').addEventListener('click', e => { const m = $('#mas-menu'); m.hidden = !m.hidden; $('#mas-btn').setAttribute('aria-expanded', String(!m.hidden)); });
$('#imp-file').addEventListener('change', e => importarArchivo(e.target));

document.addEventListener('input', e => {
  const el = e.target;
  const idCampo = el.dataset && (el.dataset.item || abierto);
  if(el.matches('[data-path]') && idCampo && !el.readOnly){
    const path = el.dataset.path;
    const esTexto = el.tagName === 'TEXTAREA' || ['text','url','search'].includes(el.type);
    cambiar(idCampo, [{ op:'set', path, value: el.value }], esTexto ? 900 : 0);
    if(path === 'mes'){ renderBoardLuego(); return; }
    if(path === 'titulo' || path.startsWith('fechas.') || path.startsWith('publicado.') || path === 'origen.drive') renderBoardLuego();
  }
  if(el.id === 'buscar'){ filtro = el.value.trim().toLowerCase(); renderBoard(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.matches('[data-subir]')) subirArchivos(el.dataset.subir, el);
  if(el.matches('[data-act-change="moverSelect"]')){ const k = el.value; $('#menu-video').hidden = true; moverA(abierto, k); }
  if(el.id === 'nv-srt' && el.files[0]){
    const r = new FileReader();
    r.onload = ev => {
      const p = parseSrt(String(ev.target.result));
      if(!p.length){ estadoEn('nv-st', 'No se pudo leer el .srt. Escribe el guion a mano.', true); return; }
      nvTiempos = p.map(x => x.times);
      $('#nv-guion').value = p.map(x => x.text).join('\n');
    };
    r.readAsText(el.files[0]);
  }
  if(el.matches('[data-path]') && (el.type === 'date' || el.type === 'url' || el.type === 'month')){
    const idCampo = el.dataset.item || abierto;
    enviar(idCampo); renderBoard();
    if(abierto && !el.dataset.item && (/\.drive$/.test(el.dataset.path) || /fecha|publicacion$/.test(el.dataset.path))) renderSheet();
  }
});
document.addEventListener('focusout', e => { if(e.target.matches && e.target.matches('[data-path]')){ const id = e.target.dataset.item || abierto; if(id) enviar(id); } });
let rbTimer;
function renderBoardLuego(){ clearTimeout(rbTimer); rbTimer = setTimeout(renderBoard, 600); }
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('#modal-root').innerHTML){ $('#modal-root').innerHTML = ''; return; }
  const m = document.querySelector('.menu-list:not([hidden])');
  if(m){ m.hidden = true; return; }
  if(abierto) cerrar();
});
