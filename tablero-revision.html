<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap');

:root{
  --bg:#211C17;
  --panel:#2B241D;
  --panel-raised:#332B22;
  --line:#463C30;
  --brass:#C9A24B;
  --brass-dim:#8C743A;
  --text:#F1E9DA;
  --text-dim:#B3A896;
  --amber:#D69A3C;
  --green:#7FA773;
  --grey:#6E6357;
  --blue:#7C97A8;
  --red-flag:#C77B5F;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Public Sans',sans-serif;
  font-size:15px;
  line-height:1.5;
  transition:background .25s ease;
}
body.mode-corregir{background:#3A211A;}
body.mode-aprobado{background:#1E2A1C;}
body.mode-subido{background:#1B242C;}

.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px;}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
h1{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:26px;
  margin:0 0 4px;
  letter-spacing:.2px;
}
.subtitle{color:var(--text-dim);font-size:13.5px;margin:0;}
button{font-family:inherit;cursor:pointer;}
.btn-add{
  background:var(--brass);
  color:#241D14;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  font-weight:600;
  font-size:14px;
}
.btn-add:hover{background:#DBB05C;}

/* ---------- dashboard ---------- */
.dash-bar{
  display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.dash-toggle{
  background:transparent;
  border:1px solid var(--line);
  color:var(--text-dim);
  border-radius:7px;
  padding:5px 11px;
  font-size:12.5px;
}
.dash-toggle:hover{color:var(--brass);border-color:var(--brass-dim);}
.dash-compact{display:flex;gap:14px;flex-wrap:wrap;}
.dash-chip{
  display:flex;align-items:center;gap:6px;
  font-size:12.5px;color:var(--text-dim);
}
.dash-chip b{color:var(--text);font-weight:600;}

.dash{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:18px;
}
.dash-col{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 13px;
}
.dash-col.is-corregir{border-color:var(--red-flag);}
.dash-col.is-aprobado{border-color:var(--green);}
.dash-col.is-subido{border-color:var(--blue);}
.dash-up{
  flex:0 0 auto;
  background:var(--panel-raised);
  border:1px solid var(--blue);
  color:var(--blue);
  border-radius:5px;
  font-size:10.5px;
  padding:1px 7px;
  margin-left:4px;
}
.dash-up:hover{background:var(--blue);color:#16202A;}
.dash-undo{
  flex:0 0 auto;
  background:transparent;
  border:1px solid var(--line);
  color:var(--text-dim);
  border-radius:5px;
  font-size:11px;
  padding:1px 6px;
  margin-left:4px;
}
.dash-undo:hover{color:var(--green);border-color:var(--green);}
.dash-date{
  flex:0 0 auto;
  font-size:10.5px;
  color:var(--blue);
  white-space:nowrap;
}
.dash-head{
  display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:8px;
}
.dash-count{
  margin-left:auto;
  font-family:'Fraunces',serif;
  font-size:17px;color:var(--text);
  letter-spacing:0;
}
.dash-items{display:flex;flex-direction:column;gap:4px;}
.dash-item{
  display:flex;align-items:center;gap:6px;
  background:transparent;border:none;
  color:var(--text);font-size:12.5px;
  padding:3px 0;text-align:left;width:100%;
}
.dash-item .nm{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1 1 auto;
}
.dash-item:hover .nm{color:var(--brass);}
.dash-dl{
  flex:0 0 auto;
  background:var(--panel-raised);
  border:1px solid var(--green);
  color:var(--green);
  border-radius:5px;
  font-size:11px;
  padding:1px 7px;
  text-decoration:none;
  line-height:1.6;
}
.dash-dl.off{border-color:var(--line);color:var(--grey);cursor:default;}
.dash-empty{font-size:12px;color:var(--grey);}
.dash-item.bajado .nm{color:var(--grey);}
.dash-item.bajado:hover .nm{color:var(--text-dim);}
.dash-tag{
  flex:0 0 auto;
  font-size:10px;
  color:var(--grey);
  border:1px solid var(--line);
  border-radius:4px;
  padding:0 6px;
  white-space:nowrap;
}
.dash-dl.pending{border-color:var(--green);color:var(--green);}
.dash-dl.done{border-color:var(--line);color:var(--grey);}
.dash-dl.done:hover{border-color:var(--green);color:var(--green);}
.dash-dl-all{
  background:var(--panel-raised);
  border:1px solid var(--green);
  color:var(--green);
  border-radius:6px;
  font-size:10.5px;
  padding:2px 8px;
  letter-spacing:0;
  text-transform:none;
}
.dash-dl-all:hover{background:var(--green);color:#1E2A1B;}
.dash-dl-all.alt{border-color:var(--line);color:var(--text-dim);}
.dash-dl-all.alt:hover{background:var(--line);color:var(--text);}
.dash-btns{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;}
.dash-head .dash-btns + .dash-count{margin-left:10px;}
.dash-head .dash-dl-all + .dash-count{margin-left:10px;}

.guion-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.btn-srt{
  background:var(--panel-raised);
  border:1px solid var(--brass-dim);
  color:var(--brass);
  border-radius:7px;
  font-size:12px;
  padding:4px 10px;
}
.btn-srt:hover{background:var(--brass);color:#241D14;}

/* ---------- modo solo lectura ---------- */
body.readonly #owner-actions,
body.readonly .save-bar,
body.readonly .btn-record,
body.readonly .btn-delete-audio,
body.readonly .note-block,
body.readonly .tc-area-add,
body.readonly .copy-edit-btn{display:none !important;}
body.readonly .pill{pointer-events:none;opacity:.85;}
body.readonly textarea{opacity:.9;cursor:default;}
body.readonly select{opacity:.9;}
.readonly-badge{
  display:none;
  background:var(--panel-raised);
  border:1px solid var(--line);
  color:var(--text-dim);
  border-radius:20px;
  padding:4px 12px;
  font-size:12px;
}
body.readonly .readonly-badge{display:inline-block;}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tab{
  flex:0 0 auto;
  padding:9px 14px;
  border-radius:8px 8px 0 0;
  background:transparent;
  border:none;
  color:var(--text-dim);
  font-size:13.5px;
  display:flex;align-items:center;gap:7px;
  white-space:nowrap;
}
.tab.active{background:var(--panel);color:var(--text);}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}

/* ---------- two-column layout ---------- */
.layout{
  display:grid;
  grid-template-columns:minmax(260px,360px) minmax(0,1fr);
  gap:20px;
  align-items:start;
}
.col-video{position:sticky;top:18px;}
.col-review{
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  padding-right:12px;
}
.col-review::-webkit-scrollbar{width:9px;}
.col-review::-webkit-scrollbar-track{background:var(--panel);border-radius:5px;}
.col-review::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
.col-review::-webkit-scrollbar-thumb:hover{background:var(--brass-dim);}

.panel{background:var(--panel);border-radius:12px;padding:18px;}
.panel.mode-corregir{
  background:#40251D;
  box-shadow:inset 0 0 0 2px var(--red-flag);
}
.panel.mode-corregir .copy-display,
.panel.mode-corregir textarea,
.panel.mode-corregir .tc-time,
.panel.mode-corregir .pill{background:#33201A;}
.panel.mode-aprobado{
  background:#22301F;
  box-shadow:inset 0 0 0 2px var(--green);
}
.panel.mode-aprobado .copy-display,
.panel.mode-aprobado textarea,
.panel.mode-aprobado .tc-time,
.panel.mode-aprobado .pill{background:#1C2719;}
.panel.mode-subido{
  background:#1F2B34;
  box-shadow:inset 0 0 0 2px var(--blue);
}
.panel.mode-subido .copy-display,
.panel.mode-subido textarea,
.panel.mode-subido .tc-time,
.panel.mode-subido .pill{background:#1A2229;}
.empty{color:var(--text-dim);text-align:center;padding:60px 20px;}
.empty p{margin:0 0 14px;}

.correct-banner{
  display:none;
  background:var(--red-flag);
  border:none;
  color:#2A1512;
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  font-weight:600;
  margin-bottom:12px;
}
.mode-corregir .correct-banner{display:block;}
.approved-banner{
  display:none;
  background:var(--green);
  border:none;
  color:#16210F;
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  font-weight:600;
  margin-bottom:12px;
}
.mode-aprobado .approved-banner{display:block;}
.uploaded-banner{
  display:none;
  background:var(--blue);
  border:none;
  color:#101A21;
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  font-weight:600;
  margin-bottom:12px;
}
.mode-subido .uploaded-banner{display:block;}

.video-frame{
  position:relative;
  height:min(60vh, 560px);
  aspect-ratio:9/16;
  width:auto;
  max-width:100%;
  margin:0 auto 14px;
  background:#000;
  border-radius:9px;
  overflow:hidden;
}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.hd-badge{
  position:absolute;
  top:8px;left:8px;
  background:rgba(0,0,0,.6);
  border:1px solid var(--green);
  color:var(--green);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.5px;
  border-radius:5px;
  padding:1px 7px;
  pointer-events:none;
}

.status-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.video-name{font-family:'Fraunces',serif;font-size:18px;font-weight:500;}
select.status-select{
  background:var(--panel-raised);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:7px;
  padding:8px 10px;
  font-size:13.5px;
  font-family:inherit;
}

h2.section-title{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:16px;
  margin:0 0 12px;
  color:var(--brass);
}

.line-row{
  display:grid;
  grid-template-columns:26px 1fr;
  gap:12px;
  padding:14px 0;
  border-top:1px solid var(--line);
}
.line-row:first-of-type{border-top:none;}
.line-num{font-family:'Public Sans',monospace;color:var(--text-dim);font-size:12.5px;padding-top:3px;}
.line-text{font-size:14.5px;margin-bottom:8px;}
.line-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pill{
  border:1px solid var(--line);
  background:var(--panel-raised);
  color:var(--text-dim);
  border-radius:20px;
  padding:5px 12px;
  font-size:12.5px;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.pill.ok{color:var(--green);border-color:var(--green);}
.pill.flag{color:var(--red-flag);border-color:var(--red-flag);}
textarea.comment{
  flex:1 1 200px;
  min-width:140px;
  background:var(--panel-raised);
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--text);
  font-family:inherit;
  font-size:13px;
  padding:7px 9px;
  resize:vertical;
  min-height:34px;
}
textarea.comment::placeholder{color:var(--grey);}

.copy-block{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);}
.copy-display{
  white-space:pre-wrap;
  background:var(--panel-raised);
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--text);
  font-size:14px;
  padding:12px;
  margin-bottom:10px;
  line-height:1.6;
}
textarea.copy-text{
  width:100%;
  background:var(--panel-raised);
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  padding:12px;
  min-height:120px;
  margin-bottom:10px;
  line-height:1.6;
  resize:vertical;
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(15,12,9,.72);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;
}
.modal{background:var(--panel);border-radius:12px;padding:24px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
.modal h2{font-family:'Fraunces',serif;font-weight:500;font-size:19px;margin:0 0 16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;}
.field input,.field textarea,.field select{
  width:100%;background:var(--panel-raised);border:1px solid var(--line);
  border-radius:7px;color:var(--text);font-family:inherit;font-size:14px;padding:9px 10px;
}
.field textarea{min-height:90px;resize:vertical;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
.btn-cancel{background:transparent;border:1px solid var(--line);color:var(--text-dim);padding:9px 14px;border-radius:8px;font-size:13.5px;}
.loading{text-align:center;color:var(--text-dim);padding:60px 20px;}

.save-bar{
  display:flex;align-items:center;gap:12px;
  margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
}
.btn-save{
  background:var(--brass);color:#241D14;border:none;
  padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;
}
.btn-save:hover{background:#DBB05C;}
.btn-save:disabled{opacity:.6;cursor:default;}
.save-status{font-size:13px;color:var(--green);}

.tc-row{border-top:1px solid var(--line);padding:12px 0;}
.tc-row:first-of-type{border-top:none;}
.tc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.tc-time{font-family:'Public Sans',monospace;font-size:12.5px;color:var(--brass);background:var(--panel-raised);border:1px solid var(--line);border-radius:6px;padding:2px 8px;}
.tc-type{font-size:11.5px;color:var(--text-dim);border:1px solid var(--line);border-radius:6px;padding:2px 8px;}
.tc-text{font-size:14px;color:var(--text);}

.btn-record{
  background:var(--panel-raised);
  border:1px solid var(--brass);
  color:var(--brass);
  padding:9px 16px;
  border-radius:8px;
  font-size:13.5px;
  font-weight:600;
}
.btn-record.recording{
  background:var(--red-flag);
  border-color:var(--red-flag);
  color:#241D14;
}
.audio-row{margin-bottom:10px;}
.btn-delete-audio{
  background:transparent;
  border:none;
  color:var(--red-flag);
  font-size:12.5px;
  padding:4px 0 0;
  text-decoration:underline;
}

.note-block{margin-bottom:18px;}
.note-label{display:block;font-family:'Fraunces',serif;font-size:15px;color:var(--brass);margin-bottom:8px;}
textarea.note-text{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  padding:14px;
  min-height:60px;
  resize:vertical;
}
textarea.note-text::placeholder{color:var(--grey);}

@media (max-width:900px){
  .dash{grid-template-columns:1fr;gap:8px;}
  .layout{grid-template-columns:1fr;gap:14px;}
  .col-video{
    position:sticky;top:0;z-index:5;
    background:var(--bg);
    padding:8px 0;
  }
  body.mode-corregir .col-video{background:#3A211A;}
  body.mode-aprobado .col-video{background:#1E2A1C;}
  body.mode-subido .col-video{background:#1B242C;}
  .col-review{max-height:none;overflow-y:visible;padding-right:0;}
  .video-frame{height:52vh;}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Revisión — Toni Sax</h1>
      <p class="subtitle">Video, guion y copy de cada entrega, en un solo lugar</p>
      <span class="readonly-badge" style="margin-top:6px;">Solo lectura</span>
    </div>
    <div id="owner-actions" style="display:flex;gap:8px;">
      <button class="btn-cancel" onclick="exportCorrecciones()">↓ Correcciones</button>
      <button class="btn-cancel" onclick="openHdModal()">Links HD</button>
      <button class="btn-add" onclick="openModal()">Agregar video</button>
    </div>
  </header>

  <div id="dashboard"></div>
  <div id="app"><div class="loading">Cargando…</div></div>
</div>

<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h2>Agregar video</h2>
    <div class="field">
      <label>Nombre del video</label>
      <input id="f-name" type="text" placeholder="Ej. Reel 12 — jazz challenge">
    </div>
    <div class="field">
      <label>Link de Drive del video en baja calidad</label>
      <input id="f-drive" type="text" placeholder="https://drive.google.com/file/d/...">
    </div>
    <div class="field">
      <label>Link de Drive del video en HD (opcional, para descargar al aprobarse)</label>
      <input id="f-driveHD" type="text" placeholder="https://drive.google.com/file/d/...">
    </div>
    <div class="field">
      <label>Guion (.srt exportado de CapCut)</label>
      <input type="file" id="f-srt" accept=".srt" onchange="handleSrtUpload(this)">
    </div>
    <div class="field">
      <label>Guion — se llena solo al subir el .srt, o escribe aquí (una línea por renglón)</label>
      <textarea id="f-script" placeholder="¿Crees que eres tan rápido como un músico de jazz?&#10;Mira esto..."></textarea>
    </div>
    <div class="field">
      <label>Copy para revisión</label>
      <textarea id="f-copy" placeholder="Texto de la descripción / caption"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-add" onclick="addVideo()">Guardar</button>
    </div>
  </div>
</div>

<div id="hdModalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h2>Links de video en HD</h2>
    <p class="subtitle" style="margin-bottom:16px;">Pega el link de Drive del archivo en HD de cada video. Los aprobados mostrarán su botón de descarga en el tablero.</p>
    <div id="hd-fields"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeHdModal()">Cancelar</button>
      <button class="btn-add" onclick="saveHdLinks()">Guardar</button>
    </div>
  </div>
</div>

<div id="commentModalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h2>Agregar comentario</h2>
    <div class="field">
      <label>Segundo o rango de tiempo (opcional)</label>
      <input id="f-tc-time" type="text" placeholder="Ej. 0:15 o 0:15–0:18">
    </div>
    <div class="field">
      <label>Tipo</label>
      <select id="f-tc-type">
        <option value="">Sin especificar</option>
        <option value="Visual">Visual</option>
        <option value="Audio">Audio</option>
        <option value="Edición">Edición</option>
        <option value="Otro">Otro</option>
      </select>
    </div>
    <div class="field">
      <label>Comentario</label>
      <textarea id="f-tc-comment" placeholder="¿Qué hay que corregir en ese momento?"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCommentModal()">Cancelar</button>
      <button class="btn-add" onclick="addTimeComment()">Guardar</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwSnwOwdpQTZAmKCLmpynEnSCvzuhzC_jv7Afl3NTQvtP4jecCG3wNZyhUArDPsrpRUpg/exec';
const STATUSES = ['sin revisar','corregir','aprobado','subido'];
let videos = [];
let activeId = null;
let copyEditMode = false;
let dashOpen = true;
const READONLY = new URLSearchParams(location.search).has('lectura');
let srtTimes = [];

function labelEstado(st){
  if(st === 'aprobado') return 'corregido';
  return st;
}

function statusColor(s){
  if(s==='sin revisar') return 'var(--grey)';
  if(s==='corregir') return 'var(--red-flag)';
  if(s==='aprobado') return 'var(--green)';
  if(s==='subido') return 'var(--blue)';
  return 'var(--grey)';
}

function driveFileId(url){
  const m = (url||'').match(/[-\w]{25,}/);
  return m ? m[0] : null;
}
function driveEmbed(url){
  const id = driveFileId(url);
  return id ? 'https://drive.google.com/file/d/'+id+'/preview' : null;
}
function driveDownload(url){
  const id = driveFileId(url);
  return id ? 'https://drive.google.com/uc?export=download&id='+id : null;
}

function fuenteVideo(v){
  const esFinal = (v.status === 'aprobado' || v.status === 'subido');
  if(esFinal && driveEmbed(v.driveHD)) return { url: v.driveHD, hd: true };
  return { url: v.drive, hd: false };
}

function migrateStatus(s){
  if(s==='en edición' || s==='editado') return 'corregir';
  if(s==='exportado HD') return 'aprobado';
  if(STATUSES.includes(s)) return s;
  return 'sin revisar';
}

function cleanCopyText(t){
  if(t === null || t === undefined) return '';
  let s = String(t);
  // saltos de línea escritos como HTML, en cualquier variante
  s = s.replace(/&lt;\s*br\s*\/?\s*&gt;/gi, '\n');
  s = s.replace(/<\s*br\s*\/?\s*>/gi, '\n');
  // párrafos y divs también se vuelven saltos
  s = s.replace(/<\s*\/?\s*(p|div)\s*[^>]*>/gi, '\n');
  // cualquier otra etiqueta suelta se elimina
  s = s.replace(/<\/?[a-z][^>]*>/gi, '');
  // entidades comunes
  s = s.replace(/&nbsp;/gi, ' ');
  s = s.replace(/&amp;/gi, '&');
  // no más de un renglón en blanco seguido
  s = s.replace(/\n{3,}/g, '\n\n');
  return s;
}

async function load(){
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    videos = Array.isArray(data) ? data : [];
  }catch(e){
    console.error('No se pudo cargar', e);
    videos = [];
  }
  videos.forEach(v=>{
    v.status = migrateStatus(v.status);
    if(v.generalComment === undefined) v.generalComment = '';
    if(v.notesForToni === undefined) v.notesForToni = '';
    if(v.driveHD === undefined) v.driveHD = '';
    if(v.uploadedAt === undefined) v.uploadedAt = '';
    if(v.downloadedAt === undefined) v.downloadedAt = '';
    if(!Array.isArray(v.scriptLines)) v.scriptLines = [];
    if(!Array.isArray(v.timestampComments)) v.timestampComments = [];
    if(!Array.isArray(v.audioNotes)) v.audioNotes = [];
    v.copy = cleanCopyText(v.copy);
    v.copyComment = cleanCopyText(v.copyComment);
    v.generalComment = cleanCopyText(v.generalComment);
    v.notesForToni = cleanCopyText(v.notesForToni);
    v.scriptLines.forEach(l => { l.comment = cleanCopyText(l.comment); });
    v.timestampComments.forEach(c => { c.comment = cleanCopyText(c.comment); });
  });
  if(videos.length && !activeId) activeId = videos[0].id;
  render();
}

async function save(vid){
  if(READONLY) return;
  const id = vid || activeId;
  const v = videos.find(v=>v.id===id);
  if(!v) return;
  try{
    await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(v)
    });
  }catch(e){
    console.error('No se pudo guardar', e);
    throw e;
  }
}

/* ---------- SRT ---------- */
function parseSrt(content){
  const normalized = content.replace(/\r/g, '');
  const blocks = normalized.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const out = [];
  blocks.forEach(block=>{
    const rows = block.split('\n');
    let i = 0;
    if(/^\d+$/.test(rows[0].trim())) i = 1;
    let times = '';
    if(rows[i] && rows[i].includes('-->')){ times = rows[i].trim(); i += 1; }
    const text = rows.slice(i).join(' ').replace(/<[^>]+>/g,'').trim();
    if(text) out.push({ text, times });
  });
  return out;
}

/* ---------- exportar SRT corregido ---------- */
function secondsToSrt(sec){
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s2 = String(Math.floor(sec%60)).padStart(2,'0');
  const ms = String(Math.round((sec%1)*1000)).padStart(3,'0');
  return h+':'+m+':'+s2+','+ms;
}


/* ---------- exportar correcciones para el generador de guiones ---------- */
function estadoLinea(st){
  if(st === 'aprobado') return 'aprobado';
  if(st === 'cambio solicitado') return 'cambio solicitado';
  return 'sin marcar';
}

function exportCorrecciones(){
  if(!videos.length){ alert('Todavía no hay videos.'); return; }

  const hoy = new Date().toISOString().slice(0,10);
  let md = '# Correcciones de Toni — guiones\n\n';
  md += 'Exportado el ' + hoy + ' desde el tablero de revisión.\n\n';
  md += 'Cada línea del guion aparece con el texto que se usó y, si Toni pidió un cambio, ';
  md += 'lo que escribió en su comentario. Sirve como referencia de qué acepta y qué corrige.\n\n';
  md += '---\n\n';

  videos.forEach(v=>{
    md += '## ' + v.name + '\n\n';
    md += '- Estado del video: **' + v.status + '**\n\n';

    if(v.scriptLines.length){
      md += '### Guion\n\n';
      v.scriptLines.forEach((l,i)=>{
        const n = String(i+1).padStart(2,'0');
        md += '**' + n + '.** ' + (l.text || '') + '\n';
        md += '- Veredicto: ' + estadoLinea(l.status) + '\n';
        if(l.comment && l.comment.trim()){
          md += '- Comentario de Toni: ' + l.comment.trim().replace(/\n/g,' ') + '\n';
        }
        md += '\n';
      });
    }

    if(v.copy && v.copy.trim()){
      md += '### Copy\n\n';
      md += '```\n' + v.copy.trim() + '\n```\n\n';
      md += '- Veredicto: ' + estadoLinea(v.copyStatus) + '\n';
      if(v.copyComment && v.copyComment.trim()){
        md += '- Comentario de Toni: ' + v.copyComment.trim().replace(/\n/g,' ') + '\n';
      }
      md += '\n';
    }

    if(v.timestampComments && v.timestampComments.length){
      md += '### Comentarios por momento\n\n';
      v.timestampComments.forEach(c=>{
        const partes = [];
        if(c.time) partes.push(c.time);
        if(c.type) partes.push(c.type);
        const cab = partes.length ? '(' + partes.join(' · ') + ') ' : '';
        md += '- ' + cab + (c.comment || '').replace(/\n/g,' ') + '\n';
      });
      md += '\n';
    }

    if(v.generalComment && v.generalComment.trim()){
      md += '### Comentario general\n\n';
      md += v.generalComment.trim() + '\n\n';
    }

    md += '---\n\n';
  });

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'correcciones-toni-' + hoy + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function srtToSeconds(t){
  const m = (t||'').match(/(\d{2}):(\d{2}):(\d{2})[,.](\d{3})/);
  if(!m) return null;
  return (+m[1])*3600 + (+m[2])*60 + (+m[3]) + (+m[4])/1000;
}

function buildSrt(v){
  let cursor = 0;
  const DUR = 2.2;
  return v.scriptLines.map((l, i)=>{
    let times = l.times;
    if(times){
      const fin = srtToSeconds((times.split('-->')[1] || '').trim());
      if(fin !== null) cursor = fin;
    }else{
      times = secondsToSrt(cursor) + ' --> ' + secondsToSrt(cursor + DUR);
      cursor += DUR;
    }
    const texto = (l.comment && l.comment.trim()) ? l.comment.trim() : l.text;
    return (i+1) + '\n' + times + '\n' + texto;
  }).join('\n\n') + '\n';
}

function downloadSrt(vid){
  const v = videos.find(v=>v.id===vid);
  if(!v || !v.scriptLines.length){ alert('Este video no tiene guion.'); return; }
  const contenido = buildSrt(v);
  const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = v.name.replace(/[^\w\-]+/g,'_') + '_corregido.srt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function handleSrtUpload(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const parsed = parseSrt(e.target.result);
    if(!parsed.length){
      alert('No se pudo leer el .srt, revisa el archivo o escribe el guion manualmente.');
      return;
    }
    srtTimes = parsed.map(x => x.times);
    document.getElementById('f-script').value = parsed.map(x => x.text).join('\n');
  };
  reader.onerror = () => alert('No se pudo leer el archivo.');
  reader.readAsText(file);
}

/* ---------- add video ---------- */
function openModal(){document.getElementById('modalOverlay').style.display='flex';}
function closeModal(){
  document.getElementById('modalOverlay').style.display='none';
  ['f-name','f-drive','f-driveHD','f-script','f-copy'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-srt').value='';
  srtTimes = [];
}

function addVideo(){
  const name = document.getElementById('f-name').value.trim();
  const drive = document.getElementById('f-drive').value.trim();
  const driveHD = document.getElementById('f-driveHD').value.trim();
  const scriptRaw = document.getElementById('f-script').value;
  const copy = cleanCopyText(document.getElementById('f-copy').value.trim());
  if(!name || !drive){ alert('Falta el nombre o el link del video'); return; }

  const lines = scriptRaw.split('\n').map(t=>t.trim()).filter(Boolean).map((text,i)=>({
    id: 'l'+i+'_'+Date.now(), text, status:'pendiente', comment:'', times: srtTimes[i] || ''
  }));

  const video = {
    id: 'v'+Date.now(),
    name, drive, driveHD,
    status:'sin revisar',
    scriptLines: lines,
    copy: copy,
    copyStatus: 'pendiente',
    copyComment: '',
    generalComment: '',
    notesForToni: '',
    timestampComments: [],
    audioNotes: [],
    uploadedAt: '',
    downloadedAt: ''
  };
  videos.push(video);
  activeId = video.id;
  copyEditMode = false;
  closeModal();
  save(video.id);
  render();
}

  }else{
    box.innerHTML = videos.map(v=>`

        <input type="text" id="hd-${v.id}" value="${escapeHtml(v.driveHD || '')}" placeholder="https://drive.google.com/file/d/...">

    `).join('');
  }
  document.getElementById('hdModalOverlay').style.display='flex';
}

function closeHdModal(){
  document.getElementById('hdModalOverlay').style.display='none';
}

async function saveHdLinks(){
  const changed = [];
  videos.forEach(v=>{
    const input = document.getElementById('hd-'+v.id);
    if(!input) return;
    const val = input.value.trim();
    if(val !== (v.driveHD || '')){
      v.driveHD = val;
      changed.push(v.id);
    }
  });
  closeHdModal();
  renderDashboard();
  const activo = videos.find(v=>v.id===activeId);
  if(activo) refrescarFuenteVideo(activo);
  for(const id of changed){
    try{ await save(id); }catch(e){ console.error('No se pudo guardar el link HD de', id, e); }
  }
}

/* ---------- in-place status updates (no video reload) ---------- */
function setVideoStatus(id, status){
  const v = videos.find(v=>v.id===id);
  if(!v) return;
  v.status = status;
  if(status === 'subido' && !v.uploadedAt) v.uploadedAt = new Date().toISOString();
  if(status !== 'subido') v.uploadedAt = '';
  refrescarFuenteVideo(v);
  const dot = document.getElementById('dot-'+id);
  if(dot) dot.style.background = statusColor(status);
  applyCorrectMode(status);
  renderDashboard();
  save(id);
}

function applyReadonly(){
  if(!READONLY) return;
  document.body.classList.add('readonly');
  document.querySelectorAll('textarea').forEach(t=>{ t.readOnly = true; });
  document.querySelectorAll('select').forEach(sel=>{ sel.disabled = true; });
}

function statusModeClass(status){
  if(status === 'corregir') return ' mode-corregir';
  if(status === 'aprobado') return ' mode-aprobado';
  if(status === 'subido') return ' mode-subido';
  return '';
}

function applyCorrectMode(status){
  const on = status === 'corregir';
  const corr = status === 'corregir';
  const apr  = status === 'aprobado';
  const sub  = status === 'subido';
  document.body.classList.toggle('mode-corregir', corr);
  document.body.classList.toggle('mode-aprobado', apr);
  document.body.classList.toggle('mode-subido', sub);
  document.querySelectorAll('.panel').forEach(p=>{
    p.classList.toggle('mode-corregir', corr);
    p.classList.toggle('mode-aprobado', apr);
    p.classList.toggle('mode-subido', sub);
  });
}

  return 'Pendiente';
}

/* ---------- dashboard ---------- */
function renderDashboard(){
  const el = document.getElementById('dashboard');
  if(!videos.length){ el.innerHTML=''; return; }

  const groups = [
    { key:'sin revisar', label:'Sin revisar', cls:'' },
    { key:'corregir',    label:'Corregir',    cls:'is-corregir' },
    { key:'aprobado',    label:'Corregidos',  cls:'is-aprobado' },
    { key:'subido',      label:'Subidos',     cls:'is-subido' }
  ];

  const full = '<div class="dash">' + groups.map(g=>{
    const items = videos.filter(v=>v.status===g.key);
    const rows = items.length
      ? items.map(v=>{
          const dl = driveDownload(v.driveHD);
          let btn = '';
          if(g.key==='aprobado'){
            const bajado = !!v.downloadedAt;
            btn = (dl
                ? '<a class="dash-dl'+(bajado?' done':' pending')+'" href="'+dl+'" target="_blank" title="'
                  + (bajado ? 'Ya descargado' : 'Sin descargar todavía')
                  + '" onclick="event.stopPropagation();marcarDescargado(\''+v.id+'\')">'
                  + (bajado ? '✓ HD' : 'HD ↓') + '</a>'
                : '<span class="dash-dl off" title="Sin link HD">—</span>')
              + '<button class="dash-up" title="Marcar como subido a Instagram" onclick="event.stopPropagation();marcarSubido(\''+v.id+'\')">Subido</button>';
          }else if(g.key==='subido'){
            const f = v.uploadedAt ? new Date(v.uploadedAt).toLocaleDateString('es-MX',{day:'2-digit',month:'short'}) : '';
            btn = (f ? '<span class="dash-date">'+f+'</span>' : '')
                + '<button class="dash-undo" title="Regresar a aprobado" onclick="event.stopPropagation();desmarcarSubido(\''+v.id+'\')">↩</button>';
          }
          const opaco = (g.key==='aprobado' && v.downloadedAt) ? ' bajado' : '';
          const leyenda = (g.key==='aprobado' && v.downloadedAt)
            ? '<span class="dash-tag">Descargado</span>' : '';
          return '<button class="dash-item'+opaco+'" onclick="goToVideo(\''+v.id+'\')">'
               + '<span class="dot" style="background:'+statusColor(g.key)+'"></span>'
               + '<span class="nm">'+escapeHtml(v.name)+'</span>'+leyenda+btn+'</button>';
        }).join('')
      : '<span class="dash-empty">Ninguno</span>';
    let head;
    if(g.key==='aprobado' && items.some(v=>driveDownload(v.driveHD))){
      const pend = items.filter(v=>driveDownload(v.driveHD) && !v.downloadedAt).length;
      head = '<div class="dash-head">'+g.label
           + '<span class="dash-btns">'
           + (pend ? '<button class="dash-dl-all" onclick="downloadPendientes()">Descargar pendientes ('+pend+')</button>' : '')
           + '<button class="dash-dl-all alt" onclick="downloadAllApproved()">Descargar todos</button>'
           + '</span>'
           + '<span class="dash-count">'+items.length+'</span></div>';
    }else{
      head = '<div class="dash-head">'+g.label+'<span class="dash-count">'+items.length+'</span></div>';
    }
    return '<div class="dash-col '+g.cls+'">'
         + head
         + '<div class="dash-items">'+rows+'</div></div>';
  }).join('') + '</div>';

  const toggle = '<button class="dash-toggle" onclick="toggleDashboard()">'
               + (dashOpen ? '▾ Ocultar resumen' : '▸ Mostrar resumen')
               + '</button>';

  const compact = groups.map(g=>{
    const n = videos.filter(v=>v.status===g.key).length;
    return '<span class="dash-chip">'
         + '<span class="dot" style="background:'+statusColor(g.key)+'"></span>'
         + g.label+' <b>'+n+'</b></span>';
  }).join('');

  el.innerHTML = '<div class="dash-bar">'+toggle
               + (dashOpen ? '' : '<div class="dash-compact">'+compact+'</div>')
               + '</div>'
               + (dashOpen ? full : '');
}

function toggleDashboard(){
  dashOpen = !dashOpen;
  renderDashboard();
}

function descargarLote(lista, etiqueta){
  if(!lista.length){ alert('No hay videos '+etiqueta+' para descargar.'); return; }
  let msg = 'Se van a descargar '+lista.length+' video(s) en HD.';
  msg += '\n\nEl navegador puede pedirte permiso para descargar varios archivos a la vez — acéptalo.';
  if(!confirm(msg)) return;
  lista.forEach((v, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = driveDownload(v.driveHD);
      a.download = '';
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      marcarDescargado(v.id);
    }, i * 900);
  });
}

function downloadPendientes(){
  const pend = videos.filter(v => v.status==='aprobado' && driveDownload(v.driveHD) && !v.downloadedAt);
  descargarLote(pend, 'pendientes');
}

function downloadAllApproved(){
  const withHd = videos.filter(v => v.status==='aprobado' && driveDownload(v.driveHD));
  const withoutHd = videos.filter(v => v.status==='aprobado' && !driveDownload(v.driveHD));
  if(!withHd.length){ alert('Ninguno de los aprobados tiene link HD todavía.'); return; }

  let msg = 'Se van a descargar '+withHd.length+' video(s) en HD.';
  if(withoutHd.length) msg += '\n\n'+withoutHd.length+' aprobado(s) no tienen link HD y se van a omitir.';
  msg += '\n\nEl navegador puede pedirte permiso para descargar varios archivos a la vez — acéptalo.';
  if(!confirm(msg)) return;

  withHd.forEach((v, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = driveDownload(v.driveHD);
      a.download = '';
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      marcarDescargado(v.id);
    }, i * 900);
  });
}

function refrescarFuenteVideo(v){
  if(!v || v.id !== activeId) return;
  const iframe = document.getElementById('video-iframe');
  if(!iframe) return;
  const nueva = driveEmbed(fuenteVideo(v).url);
  if(nueva && iframe.src !== nueva){
    iframe.src = nueva;
    const marco = iframe.parentElement;
    const badge = marco.querySelector('.hd-badge');
    if(fuenteVideo(v).hd && !badge){
      const sp = document.createElement('span');
      sp.className = 'hd-badge';
      sp.textContent = 'HD';
      marco.appendChild(sp);
    }else if(!fuenteVideo(v).hd && badge){
      badge.remove();
    }
  }
}

function marcarDescargado(id){
  const v = videos.find(v=>v.id===id);
  if(!v || v.downloadedAt) return;
  v.downloadedAt = new Date().toISOString();
  renderDashboard();
  save(id);
}

function marcarSubido(id){
  const v = videos.find(v=>v.id===id);
  if(!v) return;
  v.status = 'subido';
  v.uploadedAt = new Date().toISOString();
  refrescarFuenteVideo(v);
  renderDashboard();
  if(v.id === activeId){
    const dot = document.getElementById('dot-'+id);
    if(dot) dot.style.background = statusColor('subido');
    const sel = document.querySelector('.status-select');
    if(sel) sel.value = 'subido';
    applyCorrectMode('subido');
  }
  save(id);
}

function desmarcarSubido(id){
  const v = videos.find(v=>v.id===id);
  if(!v) return;
  v.status = 'aprobado';
  v.uploadedAt = '';
  refrescarFuenteVideo(v);
  renderDashboard();
  if(v.id === activeId){
    const dot = document.getElementById('dot-'+id);
    if(dot) dot.style.background = statusColor('aprobado');
    const sel = document.querySelector('.status-select');
    if(sel) sel.value = 'aprobado';
    applyCorrectMode('aprobado');
  }
  save(id);
}

function goToVideo(id){
  activeId = id;
  copyEditMode = false;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- review column ---------- */
function reviewHtml(v){
  const lines = v.scriptLines.map((l,i)=>`
    <div class="line-row">
      <div class="line-num">${String(i+1).padStart(2,'0')}</div>
      <div>
        <div class="line-text">${escapeHtml(l.text)}</div>
        <div class="line-controls">
          <button id="line-btn-${l.id}" class="${pillClass(l.status)}" onclick="toggleLineStatus('${v.id}','${l.id}')">${pillLabel(l.status)}</button>
          <textarea class="comment" placeholder="Comentario…" oninput="updateLineComment('${v.id}','${l.id}',this.value)">${escapeHtml(cleanCopyText(l.comment))}</textarea>
        </div>
      </div>
    </div>
  `).join('');

  return `
    <div class="panel${statusModeClass(v.status)}">
      <div class="correct-banner">Este video está marcado para corregir.</div>
      <div class="approved-banner">Este video ya está corregido.</div>
      <div class="uploaded-banner">Este video ya está subido a Instagram.</div>

      <div class="note-block">
        <label class="note-label">Notas para Toni</label>
        <textarea class="note-text" placeholder="Cualquier cosa que quieras dejarle escrita…" oninput="updateVideoNote('${v.id}', this.value)">${escapeHtml(cleanCopyText(v.notesForToni))}</textarea>
      </div>

      <div class="guion-head">
        <h2 class="section-title" style="margin:0;">Guion</h2>
        <button class="btn-srt" onclick="downloadSrt('${v.id}')">↓ SRT corregido</button>
      </div>
      ${lines || '<p class="subtitle">Sin líneas de guion.</p>'}

      <div class="copy-block" id="copy-area">
        ${copyHtml(v)}
      </div>

      <div class="copy-block" id="tc-area">
        ${tcHtml(v)}
      </div>

      <div class="copy-block" id="audio-area">
        ${audioHtml(v)}
      </div>

      <div class="copy-block">
        <h2 class="section-title">Comentarios generales</h2>
        <textarea class="copy-text" placeholder="Cualquier observación general sobre este video…" oninput="updateGeneralComment('${v.id}', this.value)">${escapeHtml(cleanCopyText(v.generalComment))}</textarea>
      </div>

      <div class="save-bar">
        <button class="btn-save" id="save-btn" onclick="manualSave()">Guardar cambios</button>
        <span class="save-status" id="save-status"></span>
      </div>
    </div>
  `;
}

function copyHtml(v){
  const body = copyEditMode
    ? `<textarea class="copy-text" oninput="updateVideoCopy('${v.id}', this.value)">${escapeHtml(cleanCopyText(v.copy))}</textarea>
       <button class="btn-cancel copy-edit-btn" onclick="setCopyEdit(false)">Listo</button>`
    : `<div class="copy-display">${escapeHtml(cleanCopyText(v.copy)) || '<span class="subtitle">Sin copy todavía.</span>'}</div>
       <button class="btn-cancel copy-edit-btn" onclick="setCopyEdit(true)">Editar</button>`;
  return `
    <h2 class="section-title">Copy</h2>
    ${body}
    <div class="line-controls" style="margin-top:10px;">
      <button id="copy-status-btn" class="${pillClass(v.copyStatus)}" onclick="toggleCopyStatus('${v.id}')">${pillLabel(v.copyStatus)}</button>
      <textarea class="comment" placeholder="Comentario sobre el copy…" oninput="updateCopyComment('${v.id}',this.value)">${escapeHtml(cleanCopyText(v.copyComment))}</textarea>
    </div>
  `;
}

function setCopyEdit(on){
  copyEditMode = on;
  const v = videos.find(v=>v.id===activeId);
  const el = document.getElementById('copy-area');
  if(el && v){ el.innerHTML = copyHtml(v); applyReadonly(); }
}

function tcHtml(v){
  const rows = (v.timestampComments && v.timestampComments.length)
    ? v.timestampComments.map(c => `
      <div class="tc-row">
        <div class="tc-head">
          ${c.time ? `<span class="tc-time">${escapeHtml(c.time)}</span>` : ''}
          ${c.type ? `<span class="tc-type">${escapeHtml(c.type)}</span>` : ''}
          <button id="tc-btn-${c.id}" class="${c.status==='resuelto' ? 'pill ok' : 'pill'}" onclick="toggleTcStatus('${v.id}','${c.id}')">${c.status==='resuelto' ? '✓ Resuelto' : 'Pendiente'}</button>
        </div>
        <div class="tc-text">${escapeHtml(cleanCopyText(c.comment))}</div>
      </div>
    `).join('')
    : '<p class="subtitle">Sin comentarios por momento todavía.</p>';
  return `
    <h2 class="section-title">Comentarios por momento</h2>
    ${rows}
    <button class="btn-cancel tc-area-add" style="margin-top:10px;" onclick="openCommentModal('${v.id}')">Agregar comentario</button>
  `;
}

function audioHtml(v){
  const rows = (v.audioNotes && v.audioNotes.length)
    ? v.audioNotes.map(a => `
      <div class="audio-row">
        <iframe src="https://drive.google.com/file/d/${a.driveId}/preview" width="100%" height="70" allow="autoplay" style="border:0;border-radius:8px;"></iframe>
        <button class="btn-delete-audio" onclick="deleteAudioNote('${v.id}','${a.id}','${a.driveId}')">Eliminar nota</button>
      </div>
    `).join('')
    : '<p class="subtitle">Sin notas de audio todavía.</p>';
  return `
    <h2 class="section-title">Notas de audio</h2>
    ${rows}
    <button class="btn-record${isRecording && recordingVid===v.id ? ' recording' : ''}" onclick="toggleRecording('${v.id}')">
      ${isRecording && recordingVid===v.id ? '⏺ Detener y guardar' : '🎙 Grabar nota de audio'}
    </button>
    <span class="save-status" id="audio-status"></span>
  `;
}

function refreshTc(){
  const v = videos.find(v=>v.id===activeId);
  const el = document.getElementById('tc-area');
  if(el && v){ el.innerHTML = tcHtml(v); applyReadonly(); }
}
function refreshAudio(){
  const v = videos.find(v=>v.id===activeId);
  const el = document.getElementById('audio-area');
  if(el && v){ el.innerHTML = audioHtml(v); applyReadonly(); }
}

/* ---------- full render ---------- */
function render(){
  const app = document.getElementById('app');
  renderDashboard();

  if(!videos.length){
    app.innerHTML = `<div class="panel"><div class="empty"><p>Todavía no hay videos en revisión.</p><button class="btn-add" onclick="openModal()">Agregar el primero</button></div></div>`;
    document.body.classList.remove('mode-corregir','mode-aprobado','mode-subido');
    return;
  }
  const v = videos.find(v=>v.id===activeId) || videos[0];
  activeId = v.id;

  const tabs = videos.map(vid=>`
    <button class="tab ${vid.id===v.id?'active':''}" onclick="goToVideo('${vid.id}')">
      <span class="dot" id="dot-${vid.id}" style="background:${statusColor(vid.status)}"></span>${escapeHtml(vid.name)}
    </button>
  `).join('');

  const fuente = fuenteVideo(v);
  const embed = driveEmbed(fuente.url);
  const videoHtml = embed
    ? `<div class="video-frame"><iframe id="video-iframe" src="${embed}" allow="autoplay" allowfullscreen></iframe>
         ${fuente.hd ? '<span class="hd-badge">HD</span>' : ''}
       </div>`
    : `<p class="subtitle">No se pudo leer el link de Drive.</p>`;

  app.innerHTML = `
    <div class="tabs">${tabs}</div>
    <div class="layout">
      <div class="col-video">
        <div class="panel${statusModeClass(v.status)}">
          ${videoHtml}
          <div class="status-row">
            <div class="video-name">${escapeHtml(v.name)}</div>
            <select class="status-select" onchange="setVideoStatus('${v.id}', this.value)">
              ${STATUSES.map(s=>`<option value="${s}" ${s===v.status?'selected':''}>${labelEstado(s)}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
      <div class="col-review">
        ${reviewHtml(v)}
      </div>
    </div>
  `;
  applyCorrectMode(v.status);
  applyReadonly();
}

/* ---------- manual save ---------- */
async function manualSave(){
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('save-status');
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  status.textContent = '';
  try{
    await save();
    btn.textContent = 'Guardar cambios';
    status.textContent = '✓ Guardado';
  }catch(e){
    btn.textContent = 'Guardar cambios';
    status.textContent = '✗ No se pudo guardar, intenta de nuevo';
  }
  btn.disabled = false;
  setTimeout(()=>{ const s=document.getElementById('save-status'); if(s) s.textContent=''; }, 3000);
}

/* ---------- timestamp comments ---------- */
let commentModalVid = null;

function openCommentModal(vid){
  commentModalVid = vid;
  document.getElementById('commentModalOverlay').style.display='flex';
}
function closeCommentModal(){
  document.getElementById('commentModalOverlay').style.display='none';
  document.getElementById('f-tc-time').value='';
  document.getElementById('f-tc-type').value='';
  document.getElementById('f-tc-comment').value='';
  commentModalVid = null;
}

function addTimeComment(){
  const time = document.getElementById('f-tc-time').value.trim();
  const type = document.getElementById('f-tc-type').value;
  const comment = document.getElementById('f-tc-comment').value.trim();
  if(!comment){ alert('Escribe el comentario'); return; }

  const v = videos.find(v=>v.id===commentModalVid);
  if(!v) return;
  if(!Array.isArray(v.timestampComments)) v.timestampComments = [];
  v.timestampComments.push({ id:'c'+Date.now(), time, type, comment, status:'pendiente' });
  const vid = v.id;
  closeCommentModal();
  save(vid);
  refreshTc();
}

/* ---------- audio notes ---------- */
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordingVid = null;

async function toggleRecording(vid){
  if(isRecording && mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    recordingVid = vid;
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      uploadAudioNote(recordingVid, blob);
    };
    mediaRecorder.start();
    isRecording = true;
    refreshAudio();
  }catch(e){
    alert('No se pudo acceder al micrófono. Revisa los permisos del navegador para este sitio.');
  }
}

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function uploadAudioNote(vid, blob){
  isRecording = false;
  refreshAudio();
  const status = document.getElementById('audio-status');
  if(status) status.textContent = 'Subiendo…';
  try{
    const base64 = await blobToBase64(blob);
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'uploadAudio', audioBase64: base64, mimeType: 'audio/webm' })
    });
    const data = await res.json();
    if(!data.driveId) throw new Error('sin driveId');
    const v = videos.find(v=>v.id===vid);
    if(!Array.isArray(v.audioNotes)) v.audioNotes = [];
    v.audioNotes.push({ id: 'a'+Date.now(), driveId: data.driveId });
    await save(vid);
    refreshAudio();
    const s2 = document.getElementById('audio-status');
    if(s2) s2.textContent = '✓ Nota guardada';
    setTimeout(()=>{ const s=document.getElementById('audio-status'); if(s) s.textContent=''; }, 3000);
  }catch(e){
    console.error(e);
    alert('No se pudo subir la nota de audio. Intenta de nuevo.');
    refreshAudio();
  }
}

async function deleteAudioNote(vid, noteId, driveId){
  if(!confirm('¿Eliminar esta nota de audio? No se puede deshacer.')) return;
  const v = videos.find(v=>v.id===vid);
  v.audioNotes = v.audioNotes.filter(a => a.id !== noteId);
  refreshAudio();
  try{ await save(vid); }catch(e){ console.error(e); }
  try{
    await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'deleteAudio', driveId })
    });
  }catch(e){ console.error('No se pudo borrar el archivo de Drive', e); }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

load();
</script>
